<title>Live Dispatch Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  /* Dark-first: the bare root carries the dark palette; light is the override. */
  :root {
    color-scheme: dark;
    --ground: #0B1115; --surface: #111A20; --raised: #17232B; --hover: #1B2932; --rule: #22323C; --rule-2: #2E4350;
    --ink: #E7EEF1; --ink-2: #9AACB5; --ink-3: #6B808B;
    --live: #46C6DA; --go: #4FC58F; --changes: #F1B24A; --nogo: #FF6B5E; --human: #C893FF;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --ground: #F3F5F7; --surface: #FFFFFF; --raised: #EEF2F5; --hover: #E6ECF0; --rule: #DDE4E9; --rule-2: #C8D2D9;
      --ink: #0F1A20; --ink-2: #4D5F69; --ink-3: #7A8A93;
      --live: #0E7C90; --go: #1D8752; --changes: #9A6200; --nogo: #C23A2E; --human: #7A3CC4;
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --ground: #F3F5F7; --surface: #FFFFFF; --raised: #EEF2F5; --hover: #E6ECF0; --rule: #DDE4E9; --rule-2: #C8D2D9;
    --ink: #0F1A20; --ink-2: #4D5F69; --ink-3: #7A8A93;
    --live: #0E7C90; --go: #1D8752; --changes: #9A6200; --nogo: #C23A2E; --human: #7A3CC4;
  }

  body { background: var(--ground); color: var(--ink); font: 400 14px/1.5 "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 28px; }
  code, .id { font: 500 12px/1.4 "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  code { background: var(--raised); padding: 1px 5px; border-radius: 4px; }
  a { color: inherit; text-decoration-color: var(--ink-3); text-underline-offset: 2px; }
  a:hover { text-decoration-color: currentColor; }
  h2 { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 4px; text-wrap: balance; }
  h3 { font-size: 14px; font-weight: 600; margin: 0; }
  p { margin: 0; }
  .muted { color: var(--ink-2); }
  .faint { color: var(--ink-3); font-size: 12px; }
  .faint.stale { color: var(--changes); font-weight: 600; }
  .lead { color: var(--ink-2); max-width: 78ch; margin: 0 0 18px; }

  /* ---------- app bar ---------- */
  .appbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--ground) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--rule); }
  .appbar .row1 { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0 8px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand svg { flex: none; }
  .brand .t { font-size: 15px; font-weight: 650; white-space: nowrap; }
  .crumb { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid var(--rule-2); border-radius: 6px; color: var(--ink-2); font-size: 12px; font-weight: 500; line-height: 1.4; white-space: nowrap; }
  .picker { position: relative; display: inline-flex; min-width: 0; }
  .picker select { appearance: none; -webkit-appearance: none; font: 600 13px/1.3 inherit; font-family: inherit; color: var(--ink); background: var(--raised); border: 1px solid var(--rule-2); border-radius: 6px; padding: 5px 30px 5px 10px; max-width: 360px; text-overflow: ellipsis; cursor: pointer; }
  .picker select:hover { background: var(--hover); }
  .picker select:focus-visible { outline: 2px solid var(--live); outline-offset: 1px; }
  .picker select:disabled { color: var(--ink-3); cursor: default; }
  .picker::after { content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
  .picker option, .picker optgroup { background: var(--surface); color: var(--ink); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .right { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
  .status { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 6px; background: var(--raised); font-size: 12.5px; font-weight: 600; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
  .status.on { color: var(--live); } .status.on i { background: var(--live); }
  /* Tabs wrap onto a second row rather than scroll, so none is ever clipped out of sight. */
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: -1px; }
  .tabs .grp { position: relative; margin-left: 12px; }
  .tabs .grp::before { content: ""; position: absolute; left: -7px; top: 10px; bottom: 12px; width: 1px; background: var(--rule-2); }
  .tabs button { font: 500 13.5px/1 inherit; font-family: inherit; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink-2); padding: 11px 12px 12px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 7px; align-items: center; }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
  button:focus-visible, .chip:focus-visible, a:focus-visible { outline: 2px solid var(--live); outline-offset: -2px; border-radius: 4px; }
  .count { font-size: 11px; font-weight: 600; min-width: 18px; padding: 2px 6px; border-radius: 9px; background: var(--raised); color: var(--ink-2); text-align: center; }
  .count.human { background: color-mix(in srgb, var(--human) 18%, transparent); color: var(--human); }
  .count.warn { background: color-mix(in srgb, var(--changes) 18%, transparent); color: var(--changes); }

  section[role="tabpanel"] { padding: 24px 0 48px; }

  /* ---------- tiles (the shared status-cell language) ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 0 0 16px; }
  .tile { position: relative; background: var(--surface); border: 1px solid var(--rule-2); border-radius: 8px; padding: 16px 16px 14px; overflow: hidden; }
  .tile::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--tone, var(--rule-2)); }
  .tile .tl { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
  .tile .tv { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; margin: 6px 0 4px; }
  .tile .tv small { font-size: 16px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
  .tile .ts { font-size: 12px; color: var(--ink-3); }
  .tile.accent .tv { color: var(--tone); }

  /* ---------- panels ---------- */
  .panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
  .ph { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--rule); }
  .pb { padding: 16px 18px; }
  .pb.flush { padding: 0; }
  .grid { display: grid; gap: 16px; margin: 0 0 16px; }
  .g-2-1 { grid-template-columns: minmax(0, 1.65fr) minmax(320px, 1fr); }
  .g-1-1 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .scroll { overflow-x: auto; }
  svg { max-width: 100%; height: auto; display: block; }

  /* backlog cells */
  .cells { display: grid; grid-template-columns: repeat(13, minmax(96px, 1fr)); gap: 8px; }
  .cell { position: relative; background: var(--surface); border: 1px solid var(--rule-2); border-radius: 6px; padding: 12px 10px 10px; overflow: hidden; display: grid; gap: 6px; align-content: start; min-height: 96px; }
  .cell::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--tone, transparent); }
  .cell .nm { font-size: 12px; line-height: 1.35; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cell .st { font-size: 11.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; margin-top: auto; }
  .cell .st i { width: 7px; height: 7px; border-radius: 50%; background: var(--tone, var(--rule-2)); }
  .cell.done { --tone: var(--go); } .cell.conditions { --tone: var(--changes); } .cell.partial { --tone: var(--live); border-style: dashed; }
  .cell.todo { --tone: transparent; } .cell.todo .nm { color: var(--ink-2); } .cell.todo .st i { background: var(--rule-2); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  /* Later: ideas for a future iteration. Neutral tiles, since an idea has no state and awaits no one. */
  .ideas { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .tile.idea .tv { font-size: 15px; line-height: 1.35; letter-spacing: 0; margin: 6px 0; }
  .tile.idea .ts { font-size: 13px; color: var(--ink-2); }

  /* badges */
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; line-height: 1; padding: 4px 8px; border-radius: 5px; color: var(--t, var(--ink-2)); background: color-mix(in srgb, var(--t, var(--ink-3)) 15%, transparent); white-space: nowrap; }
  .tag.go, .tag.done, .tag.resolved { --t: var(--go); } .tag.changes, .tag.conditions, .tag.medium { --t: var(--changes); } .tag.nogo, .tag.killed { --t: var(--nogo); }
  .tag.running, .tag.partial { --t: var(--live); } .tag.assumed, .tag.human, .tag.proposed, .tag.pending { --t: var(--human); }
  .tag.muted, .tag.low, .tag.todo { --t: var(--ink-3); }
  /* Pull request states. Not GitHub's purple: that hue is --human here, kept for what awaits the owner. */
  .tag.open { --t: var(--live); } .tag.merged { --t: var(--go); } .tag.closed { --t: var(--nogo); }

  /* attention list */
  .att { list-style: none; margin: 0; padding: 0; }
  .att li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 13px 18px; border-bottom: 1px solid var(--rule); }
  .att li:last-child { border-bottom: 0; }
  .att .d { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--t); }
  .att b { font-weight: 600; display: block; }
  .att span.m { color: var(--ink-2); font-size: 13px; }
  /* Waiting on you: a quoted question keeps to two lines, in the sans face like the rest of the list. */
  .att .q { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .att .end { display: flex; gap: 8px; align-items: center; }
  .linkbtn { font: 500 12.5px/1 inherit; font-family: inherit; color: var(--ink-2); background: var(--raised); border: 1px solid var(--rule-2); border-radius: 6px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
  .linkbtn:hover { color: var(--ink); background: var(--hover); }
  a.linkbtn { display: inline-block; text-decoration: none; }
  /* A control that reads as the cell's own text: a real button, so it takes focus and the keyboard. */
  .rowbtn { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 3px; }
  .rowbtn:hover { text-decoration-color: var(--ink-2); }

  /* tables */
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-size: 12px; font-weight: 500; color: var(--ink-3); background: var(--raised); border-bottom-color: var(--rule-2); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: color-mix(in srgb, var(--hover) 55%, transparent); }
  tbody tr.sel td { background: color-mix(in srgb, var(--live) 10%, transparent); }
  td.num, th.num { text-align: right; }
  td.wide { min-width: 240px; }
  .sub { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
  .bar { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; min-width: 60px; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--ink-3); }

  /* outcome bars */
  .stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--raised); margin: 4px 0 12px; }
  .stack i { display: block; height: 100%; }
  .hbars { display: grid; gap: 10px; }
  .hbars .r { display: grid; grid-template-columns: 136px minmax(0, 1fr) 30px; gap: 12px; align-items: center; font-size: 13px; }
  .hbars .v { text-align: right; color: var(--ink-2); }

  /* chips */
  .chipbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .chip { font: 500 13px/1 inherit; font-family: inherit; background: var(--surface); color: var(--ink-2); border: 1px solid var(--rule-2); border-radius: 6px; padding: 7px 11px; cursor: pointer; }
  .chip[aria-pressed="true"] { color: var(--ink); background: var(--raised); border-color: var(--ink-3); }

  .callout { display: flex; gap: 12px; align-items: flex-start; border: 1px solid color-mix(in srgb, var(--t, var(--human)) 45%, transparent); background: color-mix(in srgb, var(--t, var(--human)) 9%, transparent); border-radius: 8px; padding: 12px 14px; margin: 0 0 16px; }
  .callout svg { flex: none; margin-top: 2px; }
  .callout.warn { --t: var(--changes); }
  .empty { border: 1px dashed var(--rule-2); border-radius: 10px; padding: 32px; color: var(--ink-2); text-align: center; }

  /* spec */
  .list { margin: 0; padding-left: 18px; } .list li { margin: 0 0 7px; } .list li::marker { color: var(--ink-3); }
  .goals { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .goals li { display: grid; grid-template-columns: 40px 1fr; gap: 10px; }
  .modules { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .track { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .track:last-child { border-bottom: 0; }
  .track ol { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; list-style: none; margin: 0; padding: 0; }
  .track li { display: flex; align-items: center; gap: 6px; }
  .track li + li::before { content: ""; width: 16px; height: 1px; background: var(--rule-2); }

  /* assumptions */
  tr.you td:first-child { box-shadow: inset 3px 0 0 var(--human); }
  .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; background: var(--raised); font-size: 12px; font-weight: 600; color: var(--ink-2); }
  tr.you .n { background: color-mix(in srgb, var(--human) 20%, transparent); color: var(--human); }

  /* decisions */
  .mapping td:first-child { font-style: italic; }
  .adrs { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin: 0 0 16px; }

  /* agent catalogue: a description stays two lines long until its <details> is opened */
  details.more > summary { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; list-style: none; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary:hover { color: var(--ink); }
  details.more[open] > summary { display: block; overflow: visible; }
  details.about { margin-top: 6px; font-size: 13px; color: var(--ink-2); max-width: 78ch; }
  details.about > summary { cursor: pointer; color: var(--ink-3); font-size: 12px; }
  summary:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; border-radius: 4px; }

  /* git */
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 10px 20px; margin: 0; }
  .facts dt { color: var(--ink-3); font-size: 13px; }
  .facts dd { margin: 0; }
  .steps { list-style: none; counter-reset: s; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .steps li { counter-increment: s; display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .steps li::before { content: counter(s); width: 20px; height: 20px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--ink-2); }

  @media (prefers-reduced-motion: no-preference) {
    .flow { stroke-dasharray: 5 7; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    /* .on only colours the header dot while the view is live; it pulses (.run) only while an agent is running. */
    .status.run i, .runglow { animation: ping 1.6s ease-in-out infinite; }
    @keyframes ping { 50% { opacity: 0.35; } }
  }
  footer { padding: 18px 0 32px; border-top: 1px solid var(--rule); color: var(--ink-3); font-size: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }

  @media (max-width: 1100px) { .g-2-1, .g-1-1, .g-3 { grid-template-columns: 1fr; } .cells { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); } }
  @media (max-width: 640px) {
    .wrap { padding: 0 16px; } .crumb, .updated { display: none; } .brand { flex-wrap: wrap; } .picker select { max-width: 44vw; }
    .track { grid-template-columns: 1fr; gap: 6px; } .facts { grid-template-columns: 1fr; gap: 2px; } .facts dd { margin-bottom: 8px; }
    .hbars .r { grid-template-columns: 110px minmax(0, 1fr) 26px; }
  }
</style>

<header class="appbar">
  <div class="wrap">
    <div class="row1">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 8.5h11M6.5 12h7M6.5 15.5h4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="17.5" cy="15.5" r="2" fill="currentColor"/></svg>
        <span class="t">Dispatch board</span>
        <label class="picker"><span class="sr">Project</span><select id="project" disabled><option>Loading projects…</option></select></label>
        <label class="picker"><span class="sr">Session</span><select id="session" disabled><option>All sessions</option></select></label>
        <span class="crumb" id="crumb" hidden></span>
      </div>
      <div class="right">
        <span class="faint" id="asOf"></span>
        <span class="faint updated" id="updated"></span>
        <span class="status" id="status"><i></i><span id="statusText">Connecting</span></span>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Dashboard sections">
      <button role="tab" id="tab-overview" aria-controls="panel-overview" data-tab="overview">Overview</button>
      <button role="tab" id="tab-spec" aria-controls="panel-spec" data-tab="spec">Spec</button>
      <button role="tab" id="tab-assumptions" aria-controls="panel-assumptions" data-tab="assumptions">Assumptions <span class="count human" id="c-assumptions" hidden></span></button>
      <button role="tab" id="tab-decisions" aria-controls="panel-decisions" data-tab="decisions">Decisions &amp; not worked out</button>
      <button role="tab" id="tab-backlog" aria-controls="panel-backlog" data-tab="backlog">Backlog &amp; status <span class="count warn" id="c-backlog" hidden></span></button>
      <button role="tab" id="tab-git" aria-controls="panel-git" data-tab="git">GitHub details</button>
      <button role="tab" id="tab-findings" aria-controls="panel-findings" data-tab="findings">Findings ledger</button>
      <button role="tab" id="tab-dispatch" aria-controls="panel-dispatch" data-tab="dispatch" class="grp">Dispatch</button>
      <button role="tab" id="tab-catalogue" aria-controls="panel-catalogue" data-tab="catalogue">Agent catalogue</button>
      <button role="tab" id="tab-usage" aria-controls="panel-usage" data-tab="usage">Claude usage</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section role="tabpanel" id="panel-overview" aria-labelledby="tab-overview"></section>
  <section role="tabpanel" id="panel-dispatch" aria-labelledby="tab-dispatch" hidden></section>
  <section role="tabpanel" id="panel-catalogue" aria-labelledby="tab-catalogue" hidden></section>
  <section role="tabpanel" id="panel-spec" aria-labelledby="tab-spec" hidden></section>
  <section role="tabpanel" id="panel-assumptions" aria-labelledby="tab-assumptions" hidden></section>
  <section role="tabpanel" id="panel-decisions" aria-labelledby="tab-decisions" hidden></section>
  <section role="tabpanel" id="panel-backlog" aria-labelledby="tab-backlog" hidden></section>
  <section role="tabpanel" id="panel-git" aria-labelledby="tab-git" hidden></section>
  <section role="tabpanel" id="panel-findings" aria-labelledby="tab-findings" hidden></section>
  <section role="tabpanel" id="panel-usage" aria-labelledby="tab-usage" hidden></section>
  <footer><span>Built with Claude Code and the agent-catalog plugins — planning by backlog-delivery, code by engineering-agents, review by review-agents.</span><span id="foot">Live data</span></footer>
</main>

<script>
(function () {
  // The fonts are loaded from here rather than by a <link> in the markup. A stylesheet the parser meets holds back
  // the first paint of everything after it, and this script, until it arrives, so a stalled font request left the
  // whole page blank. One a script adds blocks neither; the text shows in the fallback sans until the fonts come.
  try {
    const fonts = document.createElement('link');
    fonts.rel = 'stylesheet';
    fonts.href = 'https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..700;1,400..500&family=IBM+Plex+Mono:wght@400;500&display=swap';
    document.head.appendChild(fonts);
  } catch (e) {}  // without the fonts the page still reads, in the fallback faces
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  // Text lifted from the repo's docs carries code spans and bold; nothing else is rendered.
  const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  // A review finding's id, severity, title with its location, and remediation: the one place agent-written finding
  // text meets markup, shared by the findings ledger and the run detail, which each add only their own columns.
  const findingCells = f => `<td><span class="id">${esc(f.id)}</span></td><td class="muted">${esc(f.severity) || '—'}</td>`
    + `<td class="wide">${md(f.title)}${f.location ? `<div class="sub id">${esc(f.location)}</div>` : ''}</td>`
    + `<td class="wide muted">${md(f.remediation)}</td>`;
  const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString(undefined, { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' }); };
  const ago = iso => {
    const d = new Date(iso); if (isNaN(d)) return '';

    if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; if (m < 1440) return Math.round(m / 60) + ' h ago';

  };
  const src = d => d ? `<p class="faint" style="margin:0 0 16px">Source: ${esc(d.source)}${d.generatedAt && when(d.generatedAt) ? ` · exported ${esc(when(d.generatedAt))}` : ''}</p>` : '';
  // A project tab whose source the exporter could not read keeps its last export, marked with the time that began.
  const carried = d => d?.carriedSince ? `<div class="callout warn" data-carried>${icon('warn')}<p><b>Kept from an earlier export since ${esc(when(d.carriedSince) || d.carriedSince)}.</b> The export could not read this tab's source then or since, so it may be out of date.</p></div>` : '';
  const vKind = v => { v = String(v || '').toUpperCase(); if (v.startsWith('NO-GO')) return 'nogo'; if (v.includes('CHANGES')) return 'changes'; if (v.startsWith('GO') || v.startsWith('APPROVE')) return 'go'; return 'muted'; };
  const icon = (kind) => kind === 'lock'
    ? `<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 9V6.5a4 4 0 0 1 8 0V9" fill="none" stroke="var(--human)" stroke-width="1.7"/><rect x="4" y="9" width="12" height="9" rx="2" fill="none" stroke="var(--human)" stroke-width="1.7"/></svg>`
    : `<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3l8 14H2z" fill="none" stroke="var(--changes)" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 8v4M10 14.5v.5" stroke="var(--changes)" stroke-width="1.7" stroke-linecap="round"/></svg>`;
  const tile = (label, value, sub, tone, accent) => `<div class="tile${accent ? ' accent' : ''}" style="--tone:${tone || 'var(--rule-2)'}"><div class="tl">${esc(label)}</div><div class="tv">${value}</div><div class="ts">${sub || '&nbsp;'}</div></div>`;
  const toneOf = { done: 'var(--ink-3)', go: 'var(--go)', changes: 'var(--changes)', nogo: 'var(--nogo)', killed: 'var(--nogo)', running: 'var(--live)' };
  const stateLabel = { done: 'Built and reviewed', conditions: 'Conditions open', partial: 'Partly built', todo: 'Not started' };
  const kindLabel = { done: 'Done', go: 'Approved', changes: 'Changes required', nogo: 'Rejected', killed: 'Cut off', running: 'Running' };
  // Reads a lookup table by a key taken from the store. Own keys only: a state, kind or lane such as "constructor"
  // or "__proto__" would otherwise find an inherited member and show its text.
  const own = (table, key) => Object.hasOwn(table, key) ? table[key] : undefined;
  // A link out of the page, drawn only for a GitHub URL (null otherwise): a URL read from the store could
  // just as well be javascript: or lead anywhere, so the caller shows anything else as text.
  const ghLink = (url, inner, cls) => typeof url === 'string' && url.startsWith('https://github.com/')
    ? `<a${cls ? ` class="${cls}"` : ''} href="${esc(url)}" target="_blank" rel="noopener noreferrer">${inner}</a>` : null;
  const prState = { OPEN: ['open', 'Open'], MERGED: ['merged', 'Merged'], CLOSED: ['closed', 'Closed'] };

  // view is "p:<projectId>" or "other"; sel is the session filter ('' = all of the project's sessions);
  // selRun is the run whose detail is shown (null until one is picked, and whenever the pick leaves the view).
  let allRuns = [], runs = [], sessions = [], projects = [], tabDocs = {}, statuses = {}, view = null, sel = '', selRun = null;
  let gotSessions = false, gotProjects = false, gotRuns = false, gotCatalogue = false, loaded = false, offline = false, status = null, catalogue = null;
  let lastRefresh = null;
  // Where this copy of the board gets its data, named in the connecting and out-of-reach states so a board with
  // nothing on it always says what it could not reach. Set once, when the data adapter is chosen.
  let source = 'the live store';
  const cannotReach = () => `This view cannot reach ${source}.`;
  const connectingTo = () => `Connecting to ${source}…`;
  // The board counts its data stale more than this long after the refresher's last recorded run.
  const STALE_MS = 20 * 60000;
  // null when there is no meta/lastRefresh document, or its "at" cannot be parsed as a time: the header then
  // shows no "data as of" text and never throws, so a missing or malformed document logs no error.
  // "at" must be a string before it reaches Date: new Date() otherwise coerces null, 0 and true to
  // valid epoch dates, which would render a false "data as of 1970" header for a corrupt record.
  const asOfInfo = now => {
    if (!lastRefresh || typeof lastRefresh.at !== 'string') return null;
    const at = new Date(lastRefresh.at);
    return isNaN(at) ? null : { stale: now - at.getTime() > STALE_MS };
  };
  const docs = { spec: null, assumptions: null, decisions: null, backlog: null, git: null, findings: null, usage: null };
  const lanes = [
    ['orch', 'Orchestrator', 'this session'], ['req', 'requirements-author', 'engineering-agents'],
    ['plan', 'Gate reviewer', 'Plan · pbi-review'], ['cw', 'code-writer', 'engineering-agents'],
    ['tw', 'test-writer', 'engineering-agents'], ['cr', 'code-reviewer', 'review-agents'],
    ['ver', 'verifier', 'review-agents'], ['human', 'Human', 'plan-gate approval'],
  ];
  const OTHER = ['other', 'Other agents', 'general-purpose, Explore, …'];
  const laneName = Object.fromEntries([...lanes, OTHER].map(l => [l[0], l[1]]));
  const agentName = r => r.lane === 'other' ? (r.agent || 'agent') : (own(laneName, r.lane) || r.lane);
  const OTHER_VIEW = 'other';
  const proj = () => view && view.startsWith('p:') ? projects.find(p => 'p:' + p.id === view) || null : null;
  const inProject = () => !!proj();
  const cur = () => sessions.find(s => s.id === sel);
  const windowDays = () => sessions.find(s => s.windowDays)?.windowDays || 7;
  const sessionLive = (s, now = Date.now()) => !!s && (s.running > 0 || now - new Date(s.last) < (Number(s.windowMinutes) || 10) * 60000);
  // A session whose project is not on the board, or that has none, belongs under "Other sessions".
  const unlinked = () => sessions.filter(s => !projects.some(p => p.id === s.project));
  const filterSessions = () => { const p = proj(); return p ? sessions.filter(s => s.project === p.id) : unlinked(); };
  const scopeName = () => inProject() && !sel ? "this project's sessions" : 'this session';
  // A project keeps every pipeline lane in its swimlane; a session outside one shows only the lanes it used.
  const laneList = () => { const used = new Set(runs.map(r => r.lane)); const base = inProject() ? lanes : lanes.filter(l => used.has(l[0])); return used.has('other') ? [...base, OTHER] : base; };
  const sessionStart = id => sessions.find(s => s.id === id)?.start || '';
  // seq orders runs within one session; a project's sessions follow each other in the order they started.
  const sorted = () => runs.slice().sort((a, b) => a.session === b.session ? (a.seq ?? 0) - (b.seq ?? 0)
    : String(sessionStart(a.session)).localeCompare(String(sessionStart(b.session))) || String(a.session).localeCompare(String(b.session)));
  const agentRuns = () => runs.filter(r => r.lane !== 'orch');
  // A project is live while any of its runs is running, whichever session the filter shows.
  const agentRunning = () => { const p = proj(); return p ? allRuns.some(r => r.project === p.id && r.kind === 'running') : runs.some(r => r.kind === 'running'); };
  const isLive = now => proj() ? (agentRunning() || status?.live === true) : sessionLive(cur(), now);
  const scopeLive = now => sel ? sessionLive(cur(), now) : isLive(now);
  // Review verdicts come from reviewing lanes only; a builder's NOT-DONE is also kind 'changes'.
  const verdictRuns = () => runs.filter(r => ['plan', 'cr', 'ver'].includes(r.lane) && ['go', 'changes', 'nogo'].includes(r.kind));

  // ---------------- tabs ----------------
  const tabs = [...document.querySelectorAll('[role="tab"]')];
  function select(name, focus) {
    tabs.forEach(t => {
      const on = t.dataset.tab === name;
      t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1;
      $('panel-' + t.dataset.tab).hidden = !on;

  }
  tabs.forEach((t, i) => {
    t.addEventListener('click', () => select(t.dataset.tab));
    t.addEventListener('keydown', e => {
      const k = { ArrowRight: 1, ArrowLeft: -1 }[e.key], vis = tabs.filter(x => !x.hidden), j = vis.indexOf(t);

  let saved = 'overview';

  select(tabs.some(t => t.dataset.tab === saved) ? saved : 'overview');

  // ---------------- header ----------------
  // now: the clock reading the running window is judged by, the render's own or the minute timer's.
  function renderHeader(now = renderNow) {
    const live = isLive(now), p = proj();

    const upd = p ? status?.updatedAt : cur()?.last, branch = docs.git?.branch || p?.branch;
    $('statusText').textContent = !loaded ? (offline ? 'Offline' : 'Connecting') : p ? (live ? 'Building' : (status?.title || 'Idle')) : (live ? 'Active' : 'Idle');
    $('updated').textContent = upd ? (p ? 'Updated ' : 'Last activity ') + ago(upd) : '';

  }

  // ---------------- pipeline diagram ----------------
  function pipeline() {
    const count = l => runs.filter(r => r.lane === l).length;
    const running = l => runs.some(r => r.lane === l && r.kind === 'running');
    // The arrows move only while an agent runs; a view that is live by its status document alone keeps them still.
    const moving = agentRunning(), spec = docs.spec, you = docs.assumptions?.humanList?.length ?? '—';
    const lastPlan = (spec?.rounds || []).filter(r => r.gate === 'Plan gate').slice(-1)[0];
    const verdicts = runs.filter(r => r.lane === 'cr' && ['go', 'changes', 'nogo'].includes(r.kind)).length;
    const commits = docs.git?.commits?.length ?? '—';
    const rn = n => `${n} run${n === 1 ? '' : 's'}`;
    const node = (x, y, w, h, title, sub, meta, o = {}) => {
      const stroke = o.human ? 'var(--human)' : o.run ? 'var(--live)' : 'var(--rule-2)';
      let s = o.run ? `<rect class="runglow" x="${x - 4}" y="${y - 4}" width="${w + 8}" height="${h + 8}" rx="10" fill="none" stroke="var(--live)" stroke-opacity="0.5"/>` : '';

      s += `<text x="${x + (o.tx || 12)}" y="${y + 24}" font-size="12.5" font-weight="600" fill="${o.dim ? 'var(--ink-3)' : o.human ? 'var(--human)' : 'var(--ink)'}">${esc(title)}</text>`;

      return s;
    };
    const edge = (d, label, lx, ly, o = {}) => {
      const c = o.human ? 'var(--human)' : o.warn ? 'var(--changes)' : o.dim ? 'var(--rule-2)' : 'var(--ink-3)';
      let s = `<path d="${d}" fill="none" stroke="${c}" stroke-width="1.3" ${o.flow && moving ? 'class="flow"' : o.dash ? 'stroke-dasharray="4 4"' : ''} marker-end="url(#${o.human ? 'ph' : o.warn ? 'pw' : 'pa'})"/>`;
      if (label) s += `<text x="${lx}" y="${ly}" text-anchor="${o.anchor || 'middle'}" font-size="11" fill="${o.human ? 'var(--human)' : o.warn ? 'var(--changes)' : 'var(--ink-3)'}">${esc(label)}</text>`;
      return s;
    };
    const mk = (id, c) => `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`;
    // Six equal columns, two lanes. Column 0 of the engineering lane is intentionally empty.
    const X = [96, 284, 472, 660, 848, 1036], NW = 158, NH = 64, TY = 44, BY = 176;

    s += `<text x="0" y="${TY + 29}" font-size="12.5" font-weight="600" fill="var(--ink-2)">Planning</text><text x="0" y="${TY + 46}" font-size="11.5" fill="var(--ink-3)">governed</text>`;
    s += `<text x="0" y="${BY + 29}" font-size="12.5" font-weight="600" fill="var(--ink-2)">Engineering</text><text x="0" y="${BY + 46}" font-size="11.5" fill="var(--ink-3)">on a branch</text>`;
    // planning chain: brief → PRD → spec → review → human → board
    for (let i = 0; i < 5; i++) s += edge(`M${X[i] + NW} ${my}H${X[i + 1] - 2}`, '', 0, 0, i === 3 ? { human: true } : i === 4 ? { dash: true, dim: true } : { flow: true });
    s += edge(`M${cx(3)} ${TY}V26H${cx(2)}V${TY - 2}`, 'findings, 2 revisions', (cx(2) + cx(3)) / 2, 18, { warn: true });
    // the PRD's acceptance criteria drive the engineering lane

    s += edge(`M${X[2] + NW} ${by}H${X[3] - 2}`, '', 0, 0, { flow: true });
    s += edge(`M${X[3] + NW} ${by}H${X[4] - 2}`, '', 0, 0, { dash: true, dim: true });
    s += edge(`M${cx(3)} ${BY}V152H${cx(1) + 30}V${BY - 2}`, 'findings → fixes', (cx(1) + 30 + cx(3)) / 2, 146, { warn: true });
    s += edge(`M${cx(3)} ${BY + NH}V262H${cx(5)}V${BY + NH + 2}`, 'commits', (cx(3) + cx(5)) / 2, 278, { flow: true });
    s += edge(`M${cx(5)} ${BY}V140H${cx(4)}V${TY + NH + 2}`, 'waits for approval', (cx(4) + cx(5)) / 2, 132, { human: true, dash: true });
    // nodes last so they sit above the edges
    s += node(X[0], TY, NW, NH, 'Your brief', 'raw notes', 'docs/brief');
    s += node(X[1], TY, NW, NH, 'requirements-author', spec ? `PRD · ${spec.prd?.frs} requirements` : 'writes the PRD', rn(count('req')), { run: running('req') });
    s += node(X[2], TY, NW, NH, 'pbi-plan', spec ? `spec revision ${spec.revision}` : 'solution spec', 'planning skill');
    s += node(X[3], TY, NW, NH, 'Gate reviewer', lastPlan ? lastPlan.verdict.charAt(0) + lastPlan.verdict.slice(1).toLowerCase() : 'grades the spec', rn(count('plan')), { run: running('plan') });
    s += node(X[4], TY, NW, NH, 'Human approval', `${you} decisions pending`, 'required to proceed', { human: true, tx: 34 });
    s += `<g transform="translate(${X[4] + 11} ${TY + 10})">${icon('lock')}</g>`;
    s += node(X[5], TY, NW, NH, 'Board', 'Proposed column', '0 items until approved', { dim: true, dash: true });
    s += node(X[1], BY, NW, NH, 'code-writer', 'builds under TDD', rn(count('cw')), { run: running('cw') });
    s += node(X[2], BY, NW, NH, 'test-writer', 'backfills tests', rn(count('tw')), { run: running('tw') });
    s += node(X[3], BY, NW, NH, 'code-reviewer', `${verdicts} verdicts`, rn(count('cr')), { run: running('cr') });
    s += node(X[4], BY, NW, NH, 'verifier', count('ver') ? 'runs the app' : 'not run yet', rn(count('ver')), { run: running('ver'), dim: !count('ver'), dash: !count('ver') });
    s += node(X[5], BY, NW, NH, 'Branch', docs.git?.branch || proj()?.branch || '—', `${commits} commits`);
    return s + '</g></svg>';
  }

  // ---------------- overview ----------------
  function recentPanel() {
    const R = sorted(), recent = R.slice().reverse().slice(0, 7);
    return `<div class="panel"><div class="ph"><h3>Recent agent activity</h3><button class="linkbtn" data-go="dispatch">All runs</button></div>
        <div class="pb flush scroll"><table><thead><tr><th>#</th><th>Agent</th><th>Run</th><th>Outcome</th><th>Detail</th><th class="num">Reported tokens</th></tr></thead><tbody>
        ${recent.map(r => `<tr><td class="faint">${R.indexOf(r) + 1}</td><td style="white-space:nowrap">${esc(agentName(r))}</td><td>${esc(r.label)}</td><td><span class="tag ${esc(r.kind)}">${esc(own(kindLabel, r.kind) || r.kind)}</span></td><td class="muted">${esc(r.verdict || '')}</td><td class="num muted">${r.tok ? esc(Number(r.tok).toLocaleString()) : '—'}</td></tr>`).join('') || `<tr><td colspan="6" class="muted">No agents dispatched in ${esc(scopeName())}.</td></tr>`}
        </tbody></table></div></div>`;
  }

  // ---------------- waiting on you ----------------
  // What waits on the owner across every session in view, whatever the session filter shows: a blocker hidden by a
  // filter the owner forgot they had set is the failure this panel exists to prevent. The exporter records only what
  // the transcripts say. Whether a session has gone quiet, and how old an item is, depend on the clock, so they are
  // judged here, as liveness is; the exported document then stays the same from one refresh to the next.
  // Only a later owner message clears an item, so a session nobody returns to would keep its items for the whole
  // retention window without the age bound.
  const WAIT_AGE = 48 * 3600e3, WAIT_CAP = 20;
  // Over the cap, inferred items go first, then refusals, then asks, each oldest first. An assumption row is an exact
  // fact and is never dropped.
  const WAIT_DROP = ['prose', 'refused', 'ask'];
  const refusedAs = { 'permission-rule': 'refused by a permission rule', 'automode-blocked': 'blocked by auto mode', 'user-rejected': 'rejected by you' };
  const quietFor = ms => { const m = Math.max(0, Math.round(ms / 60000)); return m < 60 ? `${m} min` : m < 2880 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} d`; };
  function waitingOf(now) {
    const dated = [], needs = [];
    let aged = 0, more = 0;
    filterSessions().forEach(s => {
      const w = s.waiting && typeof s.waiting === 'object' ? s.waiting : null;
      if (!w) return;
      const idle = !sessionLive(s, now);
      let listed = 0;
      const add = (kind, x) => {
        const t = typeof x?.at === 'string' ? Date.parse(x.at) : NaN;
        if (!(now - t <= WAIT_AGE)) { aged++; return; }  // an unreadable time cannot be shown to be inside the bound
        dated.push({ kind, t, s, x }); listed++;
      };
      // A question put through the tool waits from the moment it is asked; one inferred from prose only once the
      // session has gone quiet, since while it is live the owner is in it.
      (Array.isArray(w.questions) ? w.questions : []).forEach(q => { if (q?.source === 'ask') add('ask', q); else if (q?.source === 'prose' && idle) add('prose', q); });
      (Array.isArray(w.refusals) ? w.refusals : []).forEach(r => add('refused', r));
      // The exporter keeps a session's newest refusals, so those it only counted are older still: they count only
      // while something of that session is listed.
      if (listed && Number(w.more) > 0) more += Number(w.more);
    });
    const rows = (list, go, text, what) => (Array.isArray(list) ? list : []).filter(r => r?.needsYou).forEach(r => needs.push({ kind: 'needs', go, text: r[text], what }));
    rows(docs.assumptions?.rows, 'assumptions', 'question', 'assumption awaiting your decision');
    rows(docs.decisions?.notWorkedOut, 'decisions', 'item', 'not worked out, awaiting you');
    let dropped = 0;
    for (const kind of WAIT_DROP) {
      const over = dated.length + needs.length - WAIT_CAP;
      if (over <= 0) break;
      const gone = new Set(dated.filter(i => i.kind === kind).sort((a, b) => a.t - b.t).slice(0, over));
      dropped += gone.size;
      dated.splice(0, dated.length, ...dated.filter(i => !gone.has(i)));
    }
    return { items: [...dated.sort((a, b) => b.t - a.t), ...needs], aged, dropped, more };
  }
  // What the minute timer compares: which items are listed, and whether the bounds hid any.
  const waitingState = now => { try { const w = waitingOf(now); return w.items.map(i => i.kind + i.t).join() + ` ${w.aged}`; } catch (e) { return ''; } };
  const waitingTile = w => tile('Waiting on you', w.items.length, w.items.length ? 'questions, refusals and decisions' : 'nothing detected', 'var(--human)', true);
  // Transcript text is data: it goes through esc() only, never md(). Assumption rows are repo text, as on their own tab.
  function waitingPanel(w, now) {
    const who = s => `${esc(s.title || s.id)} <span class="id">${esc(String(s.id).slice(0, 8))}</span>`;
    const li = (kind, tag, main, meta, end = '') => `<li style="--t:var(--human)" data-wait="${kind}"><span class="d"></span><div><b class="q">${main}</b><span class="m">${meta}</span></div><span class="end"><span class="tag human">${tag}</span>${end}</span></li>`;
    const row = it => {
      if (it.kind === 'needs') return li('needs', 'Needs you', md(it.text), esc(it.what), `<button class="linkbtn" data-go="${it.go}">View</button>`);
      const { s, x } = it, from = `${who(s)} · ${esc(ago(x.at))}`;
      if (it.kind === 'refused') return li('refused', 'Refused', `${esc(x.tool || '—')} ${esc(own(refusedAs, x.kind) || 'refused')}`, from);
      if (it.kind === 'prose') return li('prose', 'Inferred', esc(x.question), `last message looks like a question · quiet ${esc(quietFor(now - (Date.parse(s.last) || it.t)))} · ${who(s)}`);
      return li('ask', 'Asked you', esc(x.question), from);
    };
    const hidden = w.dropped + w.more;
    const foot = (hidden ? `<p class="muted">+${esc(hidden)} more waiting</p>` : '')
      + (w.aged || w.dropped ? '<p class="faint">Older than 48 hours, or beyond the first 20, is not shown.</p>' : '');
    // The empty state claims only that nothing was detected, and is muted text rather than the .empty block, which
    // marks a panel the board has nothing to show for.
    return `<div class="panel" data-waiting style="margin-bottom:16px"><div class="ph"><h3>Waiting on you</h3><span class="count human">${w.items.length}</span></div>
        ${w.items.length ? `<ul class="att">${w.items.map(row).join('')}</ul>` : '<div class="pb"><p class="muted"><b>Nothing detected as waiting on you.</b> These are heuristics over transcripts; a question asked in prose may not be spotted.</p></div>'}
        ${foot ? `<div class="pb" style="border-top:1px solid var(--rule)">${foot}</div>` : ''}</div>`;
  }

  // A session linked to no project: its own activity, usage and agents, and no project tabs.
  function renderSessionOverview(p) {
    const s = cur();
    if (!s) { p.innerHTML = `<div class="empty">${loaded ? `No Claude Code session outside a project was active in the last ${esc(windowDays())} days.` : offline ? cannotReach() : connectingTo()}</div>`; return; }
    const t = s.usage?.totals || {}, ar = agentRuns(), now = runs.filter(r => r.kind === 'running').length, wait = waitingOf(renderNow);
    p.innerHTML = `
      <div class="tiles">
        ${tile('Agent runs', ar.length, ar.length ? `${verdictRuns().length} review verdicts` : 'no agents dispatched', 'var(--live)')}
        ${tile('Running now', now, sessionLive(s, renderNow) ? 'session active' : 'session idle', 'var(--live)', now > 0)}
        ${waitingTile(wait)}
        ${tile('Claude usage', fmtTok(t.effective) + '<small> effective</small>', `${esc((t.requests || 0).toLocaleString())} requests`, 'var(--live)')}
        ${tile('Limit hits', limitsOf(s.usage).length, 'usage limit', 'var(--nogo)')}
        ${forecastTile(docs.usage)}
      </div>
      ${waitingPanel(wait, renderNow)}
      <div class="grid g-2-1">
        <div class="panel"><div class="ph"><h3>Session</h3><span class="faint">Not linked to a project</span></div><div class="pb">
          <dl class="facts">
            <dt>Title</dt><dd>${esc(s.title)}</dd>
            <dt>Folder</dt><dd>${esc(s.cwd || '—')}</dd>
            <dt>Started</dt><dd>${esc(when(s.start))}</dd>
            <dt>Last activity</dt><dd>${esc(ago(s.last))}</dd>
            <dt>First request</dt><dd class="muted">${esc(s.firstPrompt || '—')}</dd>
          </dl></div></div>
        ${usagePanel()}
      </div>
      ${recentPanel()}`;
  }

  function renderOverview() {
    const p = $('panel-overview');
    if (!inProject()) return renderSessionOverview(p);
    const pbis = docs.backlog?.pbis || [], m = status?.metrics || {}, g = docs.git;
    const cnt = k => pbis.filter(x => x.state === k).length;
    const built = cnt('done') + cnt('conditions');
    const you = docs.assumptions?.humanList?.length;
    const tokens = agentRuns().reduce((a, r) => a + (Number(r.tok) || 0), 0);
    const cov = String(m.coverage || ''), covMain = (cov.match(/\d+%/) || ['—'])[0], covRest = cov.replace(covMain, '').replace(/^\s*/, '');
    const pushed = (g?.remotes || []).length > 0, wait = waitingOf(renderNow);
    const tiles = [
      tile('Work items built', pbis.length ? `${built}<small> / ${pbis.length}</small>` : '—', pbis.length ? `${cnt('conditions')} with open conditions · ${cnt('partial')} partly built` : '', 'var(--go)'),
      tile('Awaiting your decision', esc(you ?? '—'), 'assumptions at the plan gate', 'var(--human)', true),
      waitingTile(wait),
      tile('Tests passing', esc(m.tests ?? '—'), m.testFiles ? `${m.testFiles} files · commit ${esc(m.measuredOn || '')}` : '', 'var(--go)'),
      tile('Library coverage', esc(covMain), esc(covRest), 'var(--go)'),
      tile('Agent runs', esc(agentRuns().length || '—'), agentRuns().length ? `${verdictRuns().length} review verdicts · ${(tokens / 1e6).toFixed(2)}M reported tokens` : '', 'var(--live)'),
      (() => { const u = docs.usage; if (!u) return tile('Claude usage', '—', 'not exported yet', 'var(--live)'); const byAgents = (u.subagents || []).reduce((a, x) => a + x.effective, 0); return tile('Claude usage', fmtTok(u.totals?.effective) + '<small> effective</small>', `limit hit ${limitsOf(u).length}× · ${u.totals?.effective ? Math.round(byAgents / u.totals.effective * 100) : 0}% by agents`, 'var(--live)'); })(),
      forecastTile(docs.usage),
    ].join('');

    const cells = pbis.length
      ? pbis.map(x => `<div class="cell ${esc(x.state)}" title="${esc(x.id)}: ${esc(String(x.title).replace(/[`*]/g, ''))}"><span class="id">${esc(x.id)}</span><span class="nm">${esc(String(x.title).replace(/[`*]/g, ''))}</span><span class="st"><i></i>${esc(own(stateLabel, x.state) || x.state)}</span></div>`).join('')
      : '<div class="empty" style="grid-column:1/-1">The backlog has not been exported yet.</div>';

    // Needs attention, derived from the data rather than written by hand.
    const att = [];
    // Merging is the owner's decision, so an open pull request waits on them like the plan gate does.
    (Array.isArray(g?.pulls) ? g.pulls : []).filter(x => x?.state === 'OPEN')
      .forEach(x => att.push(['var(--human)', `PR #${x.number} awaiting your merge`, x.title, 'git', x.url]));
    pbis.filter(x => x.state === 'conditions').forEach(x => att.push(['var(--changes)', `${x.id} review conditions`, x.open, 'backlog']));
    pbis.filter(x => x.state === 'partial').forEach(x => att.push(['var(--live)', `${x.id} partly built`, x.open, 'backlog']));
    if (g && !pushed) att.push(['var(--ink-3)', 'Not on GitHub', 'No remote, pull request or Pages site yet.', 'git']);
    if (runs.length && !runs.some(r => r.lane === 'ver')) att.push(['var(--ink-3)', 'App not verified', 'The verifier agent has not exercised the running site yet.', 'dispatch']);
    const killed = runs.filter(r => r.kind === 'killed').length;
    if (killed) att.push(['var(--nogo)', `${killed} runs cut off`, 'Stopped or cut off before finishing.', 'dispatch']);

    const vr = verdictRuns(), vc = k => vr.filter(r => r.kind === k).length;
    const laneCounts = lanes.filter(l => !['orch', 'human'].includes(l[0])).map(l => [l[1], runs.filter(r => r.lane === l[0]).length]);
    const maxLane = Math.max(1, ...laneCounts.map(x => x[1]));

    p.innerHTML = `
      <div class="tiles">${tiles}</div>
      <div class="panel" style="margin-bottom:16px">
        <div class="ph"><h3>Backlog</h3><div class="legend"><span><i style="background:var(--go)"></i>Built and reviewed</span><span><i style="background:var(--changes)"></i>Conditions open</span><span><i style="background:var(--live)"></i>Partly built</span><span><i style="background:var(--rule-2)"></i>Not started</span></div></div>
        <div class="pb scroll"><div class="cells">${cells}</div></div>
      </div>
      <div class="panel" style="margin-bottom:16px">
        <div class="ph"><h3>Pipeline</h3><div class="legend"><span><i style="background:var(--human)"></i>Human decision</span><span><i style="background:var(--changes)"></i>Feedback loop</span><span><i style="background:var(--live)"></i>Running agent</span><span class="faint">${isLive(renderNow) ? 'Live' : 'Paused'}</span></div></div>
        <div class="pb scroll">${pipeline()}</div>
      </div>
      ${waitingPanel(wait, renderNow)}
      <div class="grid g-3">
        <div class="panel"><div class="ph"><h3>Needs attention</h3><span class="count">${att.length}</span></div>
          <ul class="att">${att.map(([t, h, m2, go, url]) => `<li style="--t:${t}"><span class="d"></span><div><b>${esc(h)}</b><span class="m">${esc(m2)}</span></div>${ghLink(url, 'Open', 'linkbtn') || `<button class="linkbtn" data-go="${go}">View</button>`}</li>`).join('') || '<li><span></span><span class="m">Nothing needs attention.</span><span></span></li>'}</ul>
        </div>
        ${usagePanel()}
        <div class="panel"><div class="ph"><h3>Review outcomes</h3><span class="faint">${vr.length} verdicts</span></div>
          <div class="pb">
            <div class="stack" role="img" aria-label="${vc('go')} approved, ${vc('changes')} changes required, ${vc('nogo')} rejected">${vr.length ? `<i style="width:${vc('go') / vr.length * 100}%;background:var(--go)"></i><i style="width:${vc('changes') / vr.length * 100}%;background:var(--changes)"></i><i style="width:${vc('nogo') / vr.length * 100}%;background:var(--nogo)"></i>` : ''}</div>
            <div class="legend" style="margin-bottom:22px"><span><i style="background:var(--go)"></i>Approved ${vc('go')}</span><span><i style="background:var(--changes)"></i>Changes required ${vc('changes')}</span><span><i style="background:var(--nogo)"></i>Rejected ${vc('nogo')}</span></div>
            <h3 style="margin-bottom:12px">Runs by agent</h3>
            <div class="hbars">${laneCounts.map(([n, v]) => `<div class="r"><span>${esc(n)}</span><span class="bar"><i style="width:${v / maxLane * 100}%;background:var(--live)"></i></span><span class="v">${v}</span></div>`).join('')}</div>
          </div></div>
      </div>
      ${recentPanel()}`;
  }

  // ---------------- dispatch ----------------
  // The run detailed is the one the owner picked, while it is still among the runs shown;
  // a pick that the session filter, the project picker or the store has taken away falls back to the latest run
  // there, so the panel always details a run the viewer can see.
  const detailed = R => R.find(r => r.id === selRun) || R[R.length - 1] || null;
  // The findings a review round reported: an array, possibly empty, when its result carried a readable findings
  // block, and nothing at all otherwise. The two are different answers and the panel says so separately.
  const runFindings = r => Array.isArray(r.findings) ? r.findings.filter(f => f && typeof f === 'object') : null;
  function runDetail(r, R) {
    const fs = runFindings(r), tone = own(toneOf, r.kind) || 'var(--ink-3)';
    // The files the run edited come from its edit and write tool calls. A run that edited none may still have
    // findings that name files, which are said as exactly that, never as files the run changed.
    const edited = [...new Set((Array.isArray(r.files) ? r.files : []).filter(f => typeof f === 'string' && f))];
    // A location is free text: "path:line", several files split by ";" or ",", line lists such as "a.js:4, 9-12",
    // or a Windows path whose drive letter has a colon of its own, so only a trailing line suffix is cut.
    const locationFiles = loc => typeof loc !== 'string' ? [] : loc.split(/[;,]/)
      .map(s => s.trim().replace(/(?::\d+(?:-\d+)?)+$/, '').trim()).filter(s => s && !/^\d+(?:-\d+)?$/.test(s));
    const named = [...new Set((fs || []).flatMap(f => locationFiles(f.location)))];
    const limit = ' The board reads the files a run writes with its edit tools; changes made through shell commands are not recorded.';
    const filesText = edited.length
      ? `Files it edited: ${edited.map(esc).join(', ')}.`
        + (edited.some(f => f.startsWith('…/')) ? " A name after …/ is a file the board could not place inside the project's repository, such as one edited in a git worktree of it, or one genuinely outside it; its folders are withheld." : '')
      : 'No file edits were recorded for this run.' + (named.length ? ` Files its findings name: ${named.map(esc).join(', ')}.` : '');
    const row = f => `<tr>${findingCells(f)}</tr>`;
    const findingsPart = fs
      ? `<div class="pb flush scroll"><table><thead><tr><th>Finding</th><th>Severity</th><th>What's wrong</th><th>Remediation</th></tr></thead><tbody>
          ${fs.map(row).join('') || '<tr><td colspan="4" class="muted">This round listed no findings.</td></tr>'}
        </tbody></table></div>`
      : `<p class="pb muted" style="border-top:1px solid var(--rule);margin:0">No findings were reported in this run's result.</p>`;
    return `<div class="panel" data-detail style="margin-bottom:16px">
      <div class="ph"><h3>Run detail</h3><span class="faint">run ${R.indexOf(r) + 1} of ${R.length} in ${esc(scopeName())}</span></div>
      <div class="pb">
        <p style="margin:0"><b>${esc(r.label || r.id)}</b></p>
        <div class="sub" style="margin:0 0 14px">${esc(agentName(r))}${r.agentType ? ' · ' + esc(r.agentType) : ''}</div>
        <div class="tiles" style="margin:0">
          ${tile('Outcome', esc(own(kindLabel, r.kind) || r.kind), esc(r.verdict || '—'), tone)}
          ${tile('Duration', r.min ? `${esc(r.min)}<small> min</small>` : '—', r.start && when(r.start) ? 'started ' + esc(when(r.start)) : 'start time not recorded')}
          ${tile('Reported tokens', r.tok ? esc(Number(r.tok).toLocaleString()) : '—', 'context size at finish')}
          ${tile('Findings', fs ? fs.length : '—', fs ? (fs.length ? 'raised by this round' : 'this round reported none') : 'none readable in its result',
            fs && fs.length ? 'var(--changes)' : undefined)}
        </div>
      </div>
      ${findingsPart}
      <p class="faint" data-files style="border-top:1px solid var(--rule);margin:0;padding:12px 18px">${filesText}${limit}</p>
    </div><!--/detail-->`;
  }

  // A builder's stated test count or coverage: one point per run that stated a readable one, numbered as the run
  // log numbers runs, so a point and its row can be matched.
  const figures = (R, key, valid) => R.map((r, i) => ({ n: i + 1, v: r[key], label: r.label || r.id }))
    .filter(p => typeof p.v === 'number' && Number.isFinite(p.v) && valid(p.v));
  function trendChart(what, pts, max, fmt) {
    const W = 560, H = 170, L = 48, RM = 14, T = 14, B = 26, iw = W - L - RM, ih = H - T - B;
    const x = i => L + (pts.length > 1 ? i * iw / (pts.length - 1) : iw / 2), y = v => T + ih - v / max * ih;
    const step = Math.max(1, Math.ceil(pts.length / 10));
    let s = `<svg data-trend="${what}" viewBox="0 0 ${W} ${H}" role="img" aria-label="The ${what} each run stated, in run order"><g font-family="Schibsted Grotesk, system-ui, sans-serif" font-size="11">`;
    [0, 0.5, 1].forEach(f => { const yy = y(max * f); s += `<line x1="${L}" x2="${L + iw}" y1="${yy}" y2="${yy}" stroke="var(--rule)"/><text x="${L - 6}" y="${yy + 3.5}" text-anchor="end" fill="var(--ink-3)">${esc(fmt(max * f))}</text>`; });
    s += `<polyline points="${pts.map((p, i) => `${x(i)},${y(p.v)}`).join(' ')}" fill="none" stroke="var(--live)" stroke-width="1.5"/>`;
    pts.forEach((p, i) => {
      s += `<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="var(--live)"><title>run ${p.n} · ${esc(fmt(p.v))} ${what} · ${esc(p.label)}</title></circle>`;
      if (i % step === 0) s += `<text x="${x(i)}" y="${H - 7}" text-anchor="middle" fill="var(--ink-3)">${p.n}</text>`;
    });
    return s + '</g></svg>';
  }
  function trendPanels(R) {
    const panel = (title, what, pts, max, fmt, example) => `<div class="panel"><div class="ph"><h3>${title}</h3><span class="faint">${pts.length} of ${R.length} runs stated one</span></div>
      ${pts.length ? `<div class="pb scroll">${trendChart(what, pts, max, fmt)}</div>` : `<p class="pb faint" style="margin:0">No ${title.toLowerCase()} recorded yet. A code-writer or test-writer run records one when its result states it, such as "${example}".</p>`}</div>`;
    const tests = figures(R, 'tests', v => v >= 0), cover = figures(R, 'coverage', v => v >= 0 && v <= 100);
    return `<div class="grid g-1-1" style="margin-top:16px">
      ${panel('Test count', 'tests', tests, niceCeil(Math.max(...tests.map(p => p.v), 0)), v => Math.round(v).toLocaleString(), '664 tests green')}
      ${panel('Coverage', 'coverage', cover, 100, v => `${Math.round(v * 10) / 10}%`, 'coverage 88%')}
    </div>`;
  }

  function renderDispatch() {
    const R = sorted(), p = $('panel-dispatch');
    if (!R.length) { p.innerHTML = '<div class="empty">No runs recorded yet. The board fills as agents are dispatched.</div>'; return; }
    const LW = 56, RW = 20, W = 1180, rowH = 38, top = 52, padB = 14;
    const LN = laneList(), laneX = {}, lw = (W - LW - RW) / LN.length;
    LN.forEach((l, i) => laneX[l[0]] = LW + i * lw);
    const H = top + R.length * rowH + padB, maxTok = Math.max(160430, ...R.map(r => Number(r.tok) || 0));
    const idx = Object.fromEntries(R.map((r, i) => [r.id, i])), y0 = i => top + 12 + i * rowH;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Swimlane of ${R.length} runs across ${LN.length} agents in dispatch order, with review verdicts fed back to the builders" style="min-width: 960px"><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><g font-family="Schibsted Grotesk, system-ui, sans-serif" font-size="12">`;
    LN.forEach((l, i) => {
      const x = laneX[l[0]];
      s += `<rect x="${x + 2}" y="${top - 38}" width="${lw - 4}" height="${H - top + 38 - padB}" rx="6" fill="${l[0] === 'human' ? 'color-mix(in srgb, var(--human) 8%, transparent)' : i % 2 ? 'var(--raised)' : 'transparent'}" fill-opacity="${l[0] === 'human' ? 1 : 0.55}" ${l[0] === 'human' ? 'stroke="var(--human)" stroke-opacity="0.5" stroke-dasharray="4 4"' : ''}/>`;
      s += `<text x="${x + lw / 2}" y="${top - 20}" text-anchor="middle" font-weight="600" font-size="12" fill="${l[0] === 'human' ? 'var(--human)' : 'var(--ink)'}">${l[1]}</text>`;
      s += `<text x="${x + lw / 2}" y="${top - 5}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)">${l[2]}</text>`;
    });
    const groups = {};
    R.forEach((r, i) => { if (r.group) (groups[r.group] = groups[r.group] || []).push(i); });
    Object.values(groups).forEach(g => {
      if (g.length < 2) return;
      const x = (own(laneX, R[g[0]].lane) ?? LW) + 6, ya = y0(g[0]) - 3, yb = y0(g[g.length - 1]) + 25;
      s += `<path d="M${x + 5} ${ya}H${x}V${yb}H${x + 5}" fill="none" stroke="var(--live)" stroke-width="1.4"/>`;
    });
    R.forEach((r, i) => {
      const link = (jid, c, dash) => {
        const j = own(idx, jid); if (j === undefined || j >= i) return;
        const x1 = (own(laneX, R[j].lane) ?? LW) + lw / 2, y1 = y0(j) + 22, x2 = (own(laneX, r.lane) ?? LW) + lw / 2, y2 = y0(i), my = (y1 + y2) / 2;
        s += `<path d="M${x1} ${y1}V${my}H${x2}V${y2 - 2}" fill="none" stroke="${c}" stroke-width="1.3" ${dash ? 'stroke-dasharray="3 4"' : ''} marker-end="url(#m)"/>`;
      };
      if (r.feeds) { const k = R[own(idx, r.feeds)]?.kind; link(r.feeds, (!k || k === 'done') ? 'var(--ink-3)' : own(toneOf, k) || 'var(--ink-3)', false); }
      if (r.from) link(r.from, 'var(--ink-3)', true);
    });
    R.forEach((r, i) => {
      const y = y0(i), x = own(laneX, r.lane) ?? LW, tok = Number(r.tok) || 0, c = own(toneOf, r.kind) || 'var(--ink-3)';
      const w = r.kind === 'running' ? lw - 18 : Math.max(22, Math.min(lw - 18, 22 + (tok / maxTok) * (lw - 42)));
      const label = String(r.label || r.id);
      s += `<text x="${LW - 12}" y="${y + 15}" text-anchor="end" font-size="11" fill="var(--ink-3)">${i + 1}</text>`;
      if (r.kind === 'running') s += `<rect class="runglow" x="${x + 5}" y="${y - 3}" width="${w + 8}" height="28" rx="7" fill="none" stroke="var(--live)"/>`;
      s += `<rect x="${x + 9}" y="${y}" width="${w}" height="22" rx="5" fill="${r.kind === 'done' ? 'var(--raised)' : 'var(--surface)'}" stroke="${c}" stroke-width="1.5" ${r.kind === 'killed' || r.kind === 'running' ? 'stroke-dasharray="4 3"' : ''}/>`;
      s += `<text x="${x + lw / 2}" y="${y + 34}" text-anchor="middle" font-size="10.5" fill="var(--ink-2)">${esc(label.length > 30 ? label.slice(0, 29) + '…' : label)}</text>`;
    });
    s += '</g></svg>';
    const tokens = agentRuns().reduce((a, r) => a + (Number(r.tok) || 0), 0), det = detailed(R);
    p.innerHTML = `
      <div class="tiles">
        ${tile('Agent runs', agentRuns().length, `dispatched in ${esc(scopeName())}`, 'var(--live)')}
        ${tile('Running now', runs.filter(r => r.kind === 'running').length, scopeLive(renderNow) ? 'live' : 'paused', 'var(--live)')}
        ${tile('Review verdicts', verdictRuns().length, `${verdictRuns().filter(r => r.kind === 'go').length} approved`, 'var(--go)')}
        ${tile('Cut off', runs.filter(r => r.kind === 'killed').length, 'stopped or cut off before finishing', 'var(--nogo)')}
        ${tile('Reported tokens', (tokens / 1e6).toFixed(2) + '<small> M</small>', 'across all runs', 'var(--rule-2)')}
      </div>
      <div class="panel" style="margin-bottom:16px"><div class="ph"><h3>Swimlane</h3><div class="legend"><span><i style="background:var(--live)"></i>Running</span><span><i style="background:var(--ink-3)"></i>Done</span><span><i style="background:var(--go)"></i>Approved</span><span><i style="background:var(--changes)"></i>Changes required</span><span><i style="background:var(--nogo)"></i>Rejected or cut off</span></div></div>
        <div class="pb scroll">${s}</div>
        <div class="pb faint" style="border-top:1px solid var(--rule)">Box width is proportional to reported tokens. Arrows show hand-offs and the verdicts that sent work back; a bracket marks runs dispatched in parallel. Gate-review rounds ran on the harness's built-in Plan agent following the catalogue's pbi-review runbook.</div></div>
      ${det ? runDetail(det, R) : ''}
      <div class="panel"><div class="ph"><h3>Run log</h3><span class="faint">pick a run for its detail · newest first</span></div>
        <div class="pb flush scroll"><table><thead><tr><th>#</th><th>Agent</th><th>Run</th><th>Outcome</th><th>Detail</th><th style="min-width:120px">Reported tokens</th><th class="num">Minutes</th></tr></thead><tbody>
        ${R.slice().reverse().map(r => `<tr${r === det ? ' class="sel"' : ''}><td class="faint">${R.indexOf(r) + 1}</td><td style="white-space:nowrap">${esc(agentName(r))}</td><td class="wide"><button type="button" class="rowbtn" data-run="${esc(r.id)}" aria-pressed="${r === det}">${esc(r.label)}</button></td><td><span class="tag ${esc(r.kind)}">${esc(own(kindLabel, r.kind) || r.kind)}</span></td><td class="muted">${esc(r.verdict || '')}</td><td>${r.tok ? `<div class="bar"><i style="width:${Math.max(2, (Number(r.tok) || 0) / maxTok * 100)}%"></i></div><div class="sub">${esc(Number(r.tok).toLocaleString())}</div>` : '<span class="faint">—</span>'}</td><td class="num muted">${esc(r.min || '—')}</td></tr>`).join('')}
        </tbody></table></div></div>

  }

  // ---------------- agent catalogue ----------------
  const later = (a, b) => !a ? b : !b ? a : (new Date(b) > new Date(a) ? b : a);
  // Uses keyed "<kind>:<id>". An agent use is its run's agentType; a skill use is a session's skillUses entry.
  // A namespaced id counts toward the entry of that kind and id, and a bare skill id toward the one catalogue
  // skill with that name. Every other id keeps its own key, which is how "outside the catalogue" is found.
  function catalogueUses(entries, runList, sessList) {
    // A Map, not a plain object: a name or id such as "constructor" would otherwise find an Object.prototype member.
    const known = new Set(entries.map(x => x.kind + ':' + x.id)), named = new Map();
    entries.filter(x => x.kind === 'skill').forEach(x => { if (!named.has(x.name)) named.set(x.name, []); named.get(x.name).push(x); });
    const skillKey = id => !known.has('skill:' + id) && !id.includes(':') && named.get(id)?.length === 1 ? 'skill:' + named.get(id)[0].id : 'skill:' + id;
    const out = new Map();
    const add = (key, n, at, project) => {
      const u = out.get(key) || { uses: 0, last: null, projects: new Set() };
      u.uses += n; u.last = later(u.last, at || null); u.projects.add(project ?? null); out.set(key, u);
    };
    runList.forEach(r => { if (typeof r.agentType === 'string' && r.agentType) add('agent:' + r.agentType, 1, r.start, r.project); });
    sessList.forEach(s => Object.entries(s?.skillUses && typeof s.skillUses === 'object' ? s.skillUses : {}).forEach(([id, v]) => {
      const n = Number(v?.count) || 0;
      if (n > 0) add(skillKey(id), n, v.last, s.project);
    }));
    return out;
  }
  // Projects in picker order; a session linked to no project on the board counts as "Other sessions".
  const projectNames = ids => {
    const names = projects.filter(p => ids.has(p.id)).map(p => p.name);
    if ([...ids].some(id => !projects.some(p => p.id === id))) names.push('Other sessions');
    return names.join(', ') || '—';
  };

  function renderCatalogue() {
    const c = catalogue, p = $('panel-catalogue');
    // "Not exported" only once the store has answered; before that, an absent document says nothing.
    if (!c) { p.innerHTML = `<div class="empty">${loaded && gotCatalogue ? 'The agent catalogue has not been exported yet.' : offline ? cannotReach() : connectingTo()}</div>`; return; }
    const entries = Array.isArray(c.entries) ? c.entries : [], groups = Array.isArray(c.plugins) ? c.plugins : [];
    const pr = proj();
    // The same scope as runs: the project narrowed by the session filter, or the chosen "Other sessions" session.
    const scoped = pr ? sessions.filter(s => s.project === pr.id && (!sel || s.id === sel)) : [cur()].filter(Boolean);
    const here = catalogueUses(entries, runs, scoped), every = catalogueUses(entries, allRuns, sessions);
    const none = { uses: 0, last: null, projects: new Set() };
    const keyOf = x => x.kind + ':' + x.id, known = new Set(entries.map(keyOf));
    const usesIn = (m, key) => m.get(key)?.uses || 0;
    const used = (m, kind) => entries.filter(x => x.kind === kind && usesIn(m, keyOf(x)) > 0).length;
    const outside = m => [...m.keys()].filter(k => !known.has(k));
    const of = kind => entries.filter(x => x.kind === kind);
    const n = (k, word) => `${k} ${word}${k === 1 ? '' : 's'}`;
    // Usage is derived from sessions and runs; before both have loaded, a count of 0 would read as "never used".
    const pending = !(gotSessions && gotRuns), wait = '<span class="faint">pending</span>';
    const kindTile = (label, kind) => tile(label, pending ? '—' : `${esc(used(here, kind))}<small> of ${esc(of(kind).length)} · ${esc(used(every, kind))} in all sessions</small>`,
      `${esc(of(kind).filter(x => x.installed).length)} installed`, 'var(--live)');
    const row = (key, kind, nameHtml, descHtml) => {
      const h = here.get(key) || none, a = every.get(key) || none;
      return `<tr data-entry="${esc(key)}"><td style="white-space:nowrap"><span class="tag muted">${esc(kind)}</span> ${nameHtml}</td>`
        + `<td class="wide">${descHtml}</td>`
        + (pending ? `<td class="num">${wait}</td><td class="muted">${wait}</td><td class="muted">${wait}</td><td class="num muted">${wait}</td></tr>`
          : `<td class="num">${h.uses ? esc(h.uses) : '<span class="tag muted">never used</span>'}</td>`
          + `<td class="muted" style="white-space:nowrap">${(h.last && esc(when(h.last))) || '—'}</td>`
          + `<td class="muted">${esc(projectNames(a.projects))}</td>`
          + `<td class="num muted">${esc(a.uses)}</td></tr>`);
    };
    const table = rows => `<div class="pb flush scroll"><table><thead><tr><th>Entry</th><th>What it is for</th><th class="num">Uses</th><th>Last use</th><th>Projects</th><th class="num">All sessions</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    const byUse = (key, name) => (x, y) => (usesIn(here, key(y)) - usesIn(here, key(x))) || String(name(x)).localeCompare(String(name(y)));
    // Descriptions are plain text from the catalogue: escaped, never rendered as markdown.
    const desc = d => d ? `<details class="more"><summary title="Show the full description">${esc(d)}</summary></details>` : '<span class="faint">No description</span>';

    const panels = groups.map(g => {
      const mine = entries.filter(x => x.plugin === g.plugin).sort(byUse(keyOf, x => x.name));
      if (!mine.length) return '';
      const full = g.purposeFull && g.purposeFull !== g.purpose ? `<details class="about"><summary>Full description</summary><p>${esc(g.purposeFull)}</p></details>` : '';
      return `<div class="panel" data-plugin="${esc(g.plugin)}" style="margin-bottom:16px"><div class="ph"><div><h3>${esc(g.plugin)}${g.installed === false ? ' <span class="tag muted">not installed</span>' : ''}</h3><p class="muted" style="font-size:13px;margin-top:2px">${esc(g.purpose || g.plugin)}</p>${full}</div>`
        + `<span class="faint">${esc(n(mine.filter(x => x.kind === 'agent').length, 'agent'))} · ${esc(n(mine.filter(x => x.kind === 'skill').length, 'skill'))}</span></div>`
        + table(mine.map(x => row(keyOf(x), x.kind, `<b style="font-weight:600">${esc(x.name)}</b><div class="sub"><span class="id">${esc(x.id)}</span></div>`, desc(x.description))).join('')) + '</div>';
    }).join('');
    const idOf = k => k.slice(k.indexOf(':') + 1);
    const out = [...new Set([...outside(every), ...outside(here)])].sort(byUse(k => k, idOf));
    const outRows = pending ? '<tr><td colspan="6" class="muted">Shown once sessions and runs have loaded.</td></tr>'
      : out.map(k => row(k, k.slice(0, k.indexOf(':')), `<span class="id">${esc(idOf(k))}</span>`, '<span class="faint">Not in the agent-catalog marketplace</span>')).join('')
      || '<tr><td colspan="6" class="muted">Nothing outside the catalogue has been used.</td></tr>';

    p.innerHTML = `
      <h2>Agent catalogue</h2>
      <div class="tiles">
        ${kindTile('Agents used', 'agent')}
        ${kindTile('Skills used', 'skill')}
        ${tile('Outside the catalogue', pending ? '—' : `${esc(outside(here).length)}<small> · ${esc(outside(every).length)} in all sessions</small>`, 'agent types and skills not in agent-catalog', 'var(--rule-2)')}
      </div>
      <p class="faint" style="margin:0 0 16px">Usage covers the sessions the board exports: the last ${esc(windowDays())} days plus every linked session.</p>
      ${panels}
      <div class="panel" data-outside><div class="ph"><div><h3>Outside the catalogue</h3><p class="muted" style="font-size:13px;margin-top:2px">Agent types and skills seen in use that the agent-catalog marketplace does not list, such as built-in agents.</p></div><span class="faint">${pending ? '—' : esc(out.length)}</span></div>
        ${table(outRows)}</div>`;
  }

  // ---------------- backlog ----------------
  function renderBacklog() {
    const d = docs.backlog, p = $('panel-backlog');
    if (!d) { p.innerHTML = '<div class="empty">The backlog has not been exported yet.</div>'; return; }
    const pbis = d.pbis || [], by = Object.fromEntries(pbis.map(x => [x.id, x]));
    // Future-iteration ideas: shown in their own group and never mixed into pbis, so no count includes them.
    const ideas = (Array.isArray(d.later) ? d.later : []).filter(x => x && typeof x === 'object');
    const cnt = k => pbis.filter(x => x.state === k).length;
    const tone = { done: 'var(--go)', conditions: 'var(--changes)', partial: 'var(--live)', todo: 'var(--rule-2)' };
    const deps = Object.fromEntries(pbis.map(x => [x.id, (String(x.dependsOn).match(/PBI-\d+/g) || []).filter(i => by[i])]));
    const layer = {}, L = id => layer[id] ?? (layer[id] = deps[id].length ? 1 + Math.max(...deps[id].map(L)) : 0);
    pbis.forEach(x => L(x.id));
    const cols = {};
    pbis.forEach(x => (cols[layer[x.id]] = cols[layer[x.id]] || []).push(x.id));
    const nL = Math.max(...Object.keys(cols).map(Number)) + 1, maxRows = Math.max(...Object.values(cols).map(c => c.length));
    const NW = 128, NH = 50, GX = 30, GY = 14, PAD = 12;
    const W = PAD * 2 + nL * NW + (nL - 1) * GX, H = PAD * 2 + maxRows * NH + (maxRows - 1) * GY, pos = {};
    Object.entries(cols).forEach(([l, ids]) => {
      const colH = ids.length * NH + (ids.length - 1) * GY, off = (H - PAD * 2 - colH) / 2;
      ids.forEach((id, i) => pos[id] = { x: PAD + Number(l) * (NW + GX), y: PAD + off + i * (NH + GY) });
    });
    let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dependency graph of ${pbis.length} work items coloured by state" style="min-width:${Math.min(W, 900)}px"><defs><marker id="da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--rule-2)"/></marker></defs><g font-family="Schibsted Grotesk, system-ui, sans-serif">`;
    pbis.forEach(x => deps[x.id].forEach(dep => {
      const a = pos[dep], c = pos[x.id]; if (!a || !c) return;
      const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = c.x - 2, y2 = c.y + NH / 2, mx = (x1 + x2) / 2;
      g += `<path d="M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" fill="none" stroke="var(--rule-2)" stroke-width="1.2" marker-end="url(#da)"/>`;
    }));
    pbis.forEach(x => {
      const q = pos[x.id], t = own(tone, x.state) || 'var(--rule-2)', title = String(x.title).replace(/[`*]/g, '');
      g += `<g><title>${esc(x.id)}: ${esc(title)} (${esc(own(stateLabel, x.state) || x.state)})</title>`;
      g += `<rect x="${q.x}" y="${q.y}" width="${NW}" height="${NH}" rx="6" fill="var(--surface)" stroke="var(--rule-2)" ${x.state === 'partial' ? 'stroke-dasharray="4 3"' : ''}/>`;
      g += `<rect x="${q.x}" y="${q.y}" width="${NW}" height="3" rx="1.5" fill="${x.state === 'todo' ? 'transparent' : t}"/>`;
      g += `<text x="${q.x + 11}" y="${q.y + 22}" font-size="12" font-weight="600" font-family="IBM Plex Mono, ui-monospace, monospace" fill="var(--ink)">${esc(x.id)}</text>`;
      g += `<text x="${q.x + 11}" y="${q.y + 39}" font-size="11" fill="var(--ink-2)">${esc(title.length > 19 ? title.slice(0, 18) + '…' : title)}</text></g>`;
    });
    g += '</g></svg>';
    p.innerHTML = `
      <h2>Backlog and status</h2>${src(d)}${carried(d)}
      <div class="tiles">
        ${tile('Built and reviewed', cnt('done'), `of ${pbis.length} work items`, 'var(--go)')}
        ${tile('Conditions open', cnt('conditions'), 'review findings to fix', 'var(--changes)')}
        ${tile('Partly built', cnt('partial'), 'interrupted', 'var(--live)')}
        ${tile('Not started', cnt('todo'), '', 'var(--rule-2)')}
