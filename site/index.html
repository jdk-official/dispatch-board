      ${d.board ? `<div class="callout warn">${icon('warn')}<p>${esc(d.board)}</p></div>` : ''}
      <div class="panel" style="margin-bottom:16px"><div class="ph"><h3>Dependencies</h3><span class="faint">arrows run from a prerequisite to what depends on it</span></div><div class="pb scroll">${g}</div></div>
      <div class="panel"><div class="ph"><h3>Work items</h3><span class="faint">${pbis.length}</span></div>
        <div class="pb flush scroll"><table><thead><tr><th>Item</th><th>Delivers</th><th>Depends on</th><th>State</th><th>Review</th><th>Still open</th></tr></thead><tbody>
        ${pbis.map(x => `<tr><td style="white-space:nowrap"><span class="id">${esc(x.id)}</span>${x.commit ? `<div class="sub id">${esc(x.commit)}</div>` : ''}</td><td class="wide">${md(x.title)}<div class="sub">${esc(x.group)} · ${esc(x.risk)} risk</div></td><td class="muted" style="white-space:nowrap">${esc(String(x.dependsOn).replace(/[\[\]]/g, '') || '—')}</td><td><span class="tag ${esc(x.state)}">${esc(own(stateLabel, x.state) || x.state)}</span></td><td class="muted">${esc(x.review)}</td><td class="wide muted">${esc(x.open) || '—'}</td></tr>`).join('')}
        </tbody></table></div></div>
      ${ideas.length ? `<div class="panel" data-later style="margin-top:16px"><div class="ph"><div><h3>Later</h3><p class="muted" style="font-size:13px;margin-top:2px">Ideas the spec records for a future iteration. They are not work items and are not counted.</p></div><span class="faint">${ideas.length}</span></div>
        <div class="pb"><div class="ideas">${ideas.map(x => `<div class="tile idea"><div class="tl">Not planned</div><div class="tv">${md(x.title)}</div>${x.description ? `<div class="ts">${md(x.description)}</div>` : ''}</div>`).join('')}</div></div></div>` : ''}`;
  }

  // ---------------- git ----------------
  function renderGit() {
    const d = docs.git, p = $('panel-git');
    if (!d) { p.innerHTML = '<div class="empty">Repository details have not been exported yet.</div>'; return; }
    const pushed = (d.remotes || []).length > 0;
    const dirs = Object.entries(d.byDir || {}).sort((a, b) => b[1] - a[1]), maxDir = Math.max(1, ...dirs.map(x => x[1]));
    // pulls is left out of the export when gh could not list them, or the origin remote is not on GitHub.
    const prs = Array.isArray(d.pulls) ? d.pulls.filter(x => x && typeof x === 'object') : null;
    const prOpen = prs ? prs.filter(x => x.state === 'OPEN').length : 0;
    const prRow = x => {
      // Own keys only: a state such as "constructor" or "__proto__" would otherwise find an inherited member.
      const [cls, label] = Object.hasOwn(prState, x.state) ? prState[x.state] : ['muted', x.state || '—'];
      return `<tr data-pr="${esc(x.number)}"><td style="white-space:nowrap">${ghLink(x.url, `#${esc(x.number)}`, 'id') || `<span class="id">#${esc(x.number)}</span>`}</td>`
        + `<td class="wide">${ghLink(x.url, esc(x.title)) || esc(x.title) + (x.url ? `<div class="sub">${esc(x.url)}</div>` : '')}</td>`
        + `<td><span class="tag ${cls}">${esc(label)}</span></td>`
        + `<td>${x.branch ? esc(x.branch) : '<span class="faint">—</span>'}</td>`
        + `<td class="muted" style="white-space:nowrap">${esc(when(x.updatedAt))}</td></tr>`;
    };
    const prBody = !prs ? '<div class="pb"><p class="muted">Pull requests are not available. The last export could not list them with the GitHub CLI, or the repository has no origin remote on GitHub.</p></div>'
      : !prs.length ? '<div class="pb"><p class="muted">No pull requests yet.</p></div>'
      : `<div class="pb flush scroll"><table><thead><tr><th>#</th><th>Title</th><th>State</th><th>Branch</th><th>Updated</th></tr></thead><tbody>${prs.map(prRow).join('')}</tbody></table></div>`;
    p.innerHTML = `
      <h2>Repository and GitHub</h2>${src(d)}${carried(d)}
      <div class="tiles">
        ${tile('GitHub', pushed ? 'Connected' : 'Not connected', pushed ? '' : 'no remote configured', 'var(--rule-2)')}
        ${tile('Commits', esc(d.commits?.length), `on ${esc(d.branch)}`, 'var(--live)')}
        ${tile('Ahead of ' + esc(d.defaultBranch || 'default'), esc(d.ahead || '0'), 'not merged', 'var(--changes)')}
        ${tile('Tracked files', esc(d.tracked), `${(d.dirty || []).length} uncommitted`, 'var(--rule-2)')}
      </div>
      ${pushed ? '' : `<div class="callout warn">${icon('warn')}<div><p><b>Not on GitHub yet.</b> There is no remote, so no repository, pull request or Pages site exists. The overnight run was deliberately told never to push. Each step below happens once you approve it.</p><ol class="steps"><li>Create the GitHub repository</li><li>Push ${esc(d.branch)}</li><li>Open a pull request into ${esc(d.defaultBranch || 'master')}</li></ol></div></div>`}
      <div class="grid g-1-1">
        <div class="panel"><div class="ph"><h3>Repository</h3></div><div class="pb">
          <dl class="facts">
            <dt>Local path</dt><dd>${esc(d.repoPath)}</dd>
            <dt>Working branch</dt><dd>${esc(d.branch)} at <code>${esc(d.head)}</code></dd>
            <dt>Default branch</dt><dd>${esc(d.defaultBranch || '—')}</dd>
            <dt>Change</dt><dd>${esc(d.shortstat || '—')}</dd>
            <dt>Remote</dt><dd>${pushed ? d.remotes.map(r => esc(r)).join('<br>') : 'None'}</dd>
            <dt>Pull requests</dt><dd>${prs ? `${prOpen} open` : pushed ? 'Not available' : 'None'}</dd>
            <dt>Pages site</dt><dd>Not deployed · base path /platform-catalogue/ configured</dd>
            <dt>Working tree</dt><dd>${(d.dirty || []).length ? d.dirty.map(x => esc(x)).join('<br>') : 'Clean'}</dd>
          </dl>
          <p class="faint" style="margin:22px 0 10px;font-weight:600">Files by folder</p>
          <div class="hbars">${dirs.map(([k, v]) => `<div class="r"><span>${esc(k)}</span><span class="bar"><i style="width:${v / maxDir * 100}%;background:var(--ink-3)"></i></span><span class="v">${v}</span></div>`).join('')}</div>
        </div></div>
        <div class="panel"><div class="ph"><h3>Commits</h3><span class="faint">newest first</span></div>
          <div class="pb flush scroll"><table><thead><tr><th>Commit</th><th>Message</th><th>When</th></tr></thead><tbody>
          ${(d.commits || []).map(c => `<tr><td><span class="id">${esc(c.sha)}</span></td><td>${esc(c.subject)}</td><td class="muted" style="white-space:nowrap">${esc(when(c.date))}</td></tr>`).join('')}
          </tbody></table></div></div>
      </div>
      <div class="panel" data-pulls style="margin-top:16px"><div class="ph"><h3>Pull requests</h3><span class="faint">${prs && prs.length ? `${esc(prs.length)} most recently updated · ${esc(prOpen)} open` : ''}</span></div>${prBody}</div>`;
  }

  // ---------------- findings ledger ----------------
  function renderFindings() {
    const d = docs.findings, p = $('panel-findings');
    if (!d) { p.innerHTML = '<div class="empty">No review round with structured findings has been recorded yet.</div>'; return; }
    const items = d.items && typeof d.items === 'object' ? d.items : {};
    const ids = Object.keys(items).sort();
    const openCount = id => (Array.isArray(items[id].open) ? items[id].open : []).length;
    const resolvedCount = id => (Array.isArray(items[id].resolved) ? items[id].resolved : []).length;
    const openTotal = ids.reduce((a, id) => a + openCount(id), 0), resolvedTotal = ids.reduce((a, id) => a + resolvedCount(id), 0);
    const wentGo = ids.filter(id => items[id].roundsToGo != null).length;
    // A finding's age in rounds: the round it was first raised, and, when it was seen again since, the last
    // round it was still listed in.
    const roundLabel = f => {
      const first = Number(f.round) || 0;
      if (!first) return '—';
      const last = Number(f.lastSeen) || first;
      return last > first ? `Round ${first}-${last}` : `Round ${first}`;
    };
    const findingRow = (f, open) => `<tr>${findingCells(f)}<td class="muted">${esc(roundLabel(f))}</td>`
      + `<td><span class="tag ${open ? 'changes' : 'go'}">${open ? 'Open' : 'Resolved'}</span></td></tr>`;
    const itemPanel = id => {
      const it = items[id] || {}, open = Array.isArray(it.open) ? it.open : [], resolved = Array.isArray(it.resolved) ? it.resolved : [];
      const rounds = Number(it.rounds) || 0, sub = `${rounds} review round${rounds === 1 ? '' : 's'}` + (it.roundsToGo != null ? ` · reached GO at round ${esc(it.roundsToGo)}` : '');
      return `<div class="panel" style="margin-bottom:16px"><div class="ph"><h3>${esc(id)}</h3><span class="faint">${sub}</span></div>
        <div class="pb flush scroll"><table><thead><tr><th>Finding</th><th>Severity</th><th>What's wrong</th><th>Remediation</th><th>Round</th><th>Status</th></tr></thead><tbody>
        ${open.map(f => findingRow(f, true)).join('') + resolved.map(f => findingRow(f, false)).join('') || '<tr><td colspan="6" class="muted">No findings recorded.</td></tr>'}
        </tbody></table></div></div>`;
    };
    p.innerHTML = `
      <h2>Review findings ledger</h2>${src(d)}
      <div class="tiles">
        ${tile('Work items reviewed', ids.length, '', 'var(--rule-2)')}
        ${tile('Open findings', openTotal, 'still to fix', 'var(--changes)')}
        ${tile('Resolved findings', resolvedTotal, 'fixed since they were raised', 'var(--go)')}
        ${tile('Reached GO', wentGo, `of ${ids.length} reviewed`, 'var(--go)')}
      </div>
      ${ids.length ? ids.map(itemPanel).join('') : '<div class="empty">No review round with structured findings has been recorded yet.</div>'}`;
  }

  // ---------------- Claude usage ----------------
  const fmtTok = n => { n = Number(n) || 0; return n >= 1e6 ? (n / 1e6).toFixed(n >= 1e8 ? 0 : 1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(Math.round(n)); };
  const niceCeil = v => { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; };
  const hourLabel = key => { const d = new Date(key + ':00:00Z'); return isNaN(d) ? key : d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); };
  // Usage limits as the exporter writes them: a list of objects. Anything else in the store counts as no limit hit.
  const limitsOf = u => (Array.isArray(u?.limits) ? u.limits : []).filter(l => l && typeof l === 'object' && !Array.isArray(l));
  const timeOf = v => typeof v === 'string' ? Date.parse(v) : NaN;
  const HOUR_MS = 3600e3;
  const dur = ms => { const m = Math.round(ms / 60000), h = Math.floor(m / 60); return h ? `${h} h${m % 60 ? ` ${m % 60} min` : ''}` : `${m} min`; };
  const FORECAST_HOW = 'the average time from when work resumed after a reset to the next limit hit, added to the latest reset. Work counts as resumed at the start of the first hour with recorded usage after the reset, or at the reset if that is later or no such hour is recorded; a hit with no reset before it is timed from the first hour with recorded usage. It assumes work picks up again when the limit resets and goes on as before, and is not a plan meter.';

  // Transcripts record only the moments a limit refused a request, so the next hit can be estimated but never
  // metered. Each hit is timed from when work resumed before it, so idle hours after a reset do not count: from
  // the start of the first hour with usage (main session or agents) that ends after the latest reset before the
  // hit, or from the reset itself when that hour began before it or the hourly usage has no such hour. A hit with
  // no reset before it is timed from the first hour with usage. The average is added to the latest reset. When the
  // latest hit's own reset is not recorded there is no time to add it to (work cannot resume before that unknown
  // reset), so only the average is returned. A hit with no readable time, or with neither a reset nor usage before
  // it, adds nothing.
  function forecastOf(u) {
    if (!u) return { state: 'absent' };
    const lim = limitsOf(u);
    if (!lim.length) return { state: 'none' };
    const timed = lim.map(l => ({ hit: timeOf(l.firstAt), reset: timeOf(l.resetsAt) })).filter(l => !isNaN(l.hit));
    const resets = lim.map(l => timeOf(l.resetsAt)).filter(t => !isNaN(t));
    const used = (Array.isArray(u.hourly) ? u.hourly : []).filter(h => h && typeof h.hour === 'string' && (Number(h.main) || 0) + (Number(h.sub) || 0) > 0)
      .map(h => timeOf(h.hour + ':00:00Z')).filter(t => !isNaN(t));
    const gaps = timed.map(({ hit }) => {
      // -Infinity when no reset came before the hit; Infinity when no hour with usage qualifies.
      const reset = Math.max(...resets.filter(r => r < hit)), resumed = Math.min(...used.filter(s => s + HOUR_MS > reset && s < hit));
      return hit - (Number.isFinite(resumed) ? Math.max(resumed, reset) : reset);
    }).filter(Number.isFinite);
    if (!gaps.length) return { state: 'unknown' };
    const last = timed.reduce((a, l) => l.hit > a.hit ? l : a), base = { gap: gaps.reduce((a, g) => a + g, 0) / gaps.length, n: gaps.length, m: lim.length };
    if (isNaN(last.reset)) return { state: 'reset-unknown', ...base };
    const at = Math.max(...resets) + base.gap;
    return isNaN(new Date(at)) ? { state: 'unknown' } : { state: 'ok', at, ...base };
  }
  // n limit hits gave a gap, of the m in usage.limits (the Limit hits tile's count).
  const hitsFrom = f => f.n === f.m ? `${esc(f.n)} limit hit${f.n === 1 ? '' : 's'}` : `${esc(f.n)} of the ${esc(f.m)} recorded limit hits`;
  const NO_FORECAST = { absent: 'no forecast: usage not exported yet', none: 'no forecast: no limit hit recorded', unknown: 'no forecast: too little timing data to estimate' };
  // A neutral tone: the forecast is neither a review verdict nor something waiting on the owner.
  function forecastTile(u) {
    const f = forecastOf(u), tone = 'var(--rule-2)';
    if (f.state === 'ok') return tile('Next limit hit', esc(when(f.at)), `estimate from ${hitsFrom(f)}${f.at < renderNow ? ' · passed with no hit since' : ''}`, tone);
    if (f.state === 'reset-unknown') return tile('Next limit hit', esc(dur(f.gap)) + ' after reset', `estimate from ${hitsFrom(f)} · reset time of the latest hit not recorded`, tone);
    return tile('Next limit hit', '—', NO_FORECAST[f.state], tone);
  }
  // The usage tab's line on how the forecast is made. The tab is drawn only when usage was exported.
  function forecastNote(f) {
    if (f.state === 'ok') return `Next limit hit is an estimate from ${hitsFrom(f)}: ${FORECAST_HOW}`;
    if (f.state === 'reset-unknown') return `Next limit hit is an estimate from ${hitsFrom(f)}. The reset time of the latest hit is not recorded, so it is shown as a time after that reset. The estimate is ${FORECAST_HOW}`;
    return `${f.state === 'none' ? 'No forecast until a limit hit is recorded.' : 'No forecast: no limit hit has both a readable time and a reset or recorded usage before it.'} The estimate is ${FORECAST_HOW}`;
  }

  // Stacked hourly bars (agents under main session), one scale for bars, gridlines and labels.
  function usageChart(u, W, H, compact) {
    // Hours as the exporter writes them: a list of objects with an hour key. Anything else draws no bar, and a main or
    // sub that is not a number counts as no usage in that hour, since one NaN would make every coordinate NaN.
    const hours = (Array.isArray(u.hourly) ? u.hourly : []).filter(h => h && typeof h.hour === 'string')
      .map(h => ({ hour: h.hour, main: Number(h.main) || 0, sub: Number(h.sub) || 0 }));
    if (!hours.length) return '<p class="faint">No hourly data.</p>';
    const L = compact ? 36 : 50, R = compact ? 6 : 64, T = 16, B = compact ? 22 : 28, iw = W - L - R, ih = H - T - B;
    const max = niceCeil(Math.max(...hours.map(h => h.main + h.sub)));
    const bw = iw / hours.length, gap = Math.min(3, bw * 0.22), y = v => T + ih - (v / max) * ih;
    const idx = iso => { const d = new Date(iso); return isNaN(d) ? -1 : hours.findIndex(h => h.hour === d.toISOString().slice(0, 13)); };
    const fs = compact ? 10 : 11;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Effective Claude usage per hour for the main session and the agents, with the times a usage limit was hit" ${compact ? '' : 'style="min-width:560px"'}><g font-family="Schibsted Grotesk, system-ui, sans-serif" font-size="${fs}">`;
    [0, 0.5, 1].forEach(f => { const yy = y(max * f); s += `<line x1="${L}" x2="${L + iw}" y1="${yy}" y2="${yy}" stroke="var(--rule)"/><text x="${L - 6}" y="${yy + 3.5}" text-anchor="end" fill="var(--ink-3)">${fmtTok(max * f)}</text>`; });
    hours.forEach((h, i) => {
      const x = L + i * bw + gap / 2, w = Math.max(1, bw - gap), when_ = esc(hourLabel(h.hour));
      if (h.sub) s += `<rect x="${x}" y="${y(h.sub)}" width="${w}" height="${T + ih - y(h.sub)}" fill="var(--live)"><title>${when_} · agents ${fmtTok(h.sub)}</title></rect>`;
      if (h.main) s += `<rect x="${x}" y="${y(h.sub + h.main)}" width="${w}" height="${y(h.sub) - y(h.sub + h.main)}" fill="var(--ink-3)"><title>${when_} · main session ${fmtTok(h.main)}</title></rect>`;
    });
    limitsOf(u).forEach((l, k) => {
      const i = idx(l.firstAt); if (i < 0) return;
      const x = L + i * bw + bw / 2;
      s += `<line x1="${x}" x2="${x}" y1="${T - 6}" y2="${T + ih}" stroke="var(--nogo)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
      if (!compact) s += `<text x="${x}" y="${T - 8}" text-anchor="middle" fill="var(--nogo)" font-size="10.5">limit ${k + 1}</text>`;
    });
    const step = Math.max(1, Math.ceil(hours.length / (compact ? 5 : 8)));
    hours.forEach((h, i) => { if (i % step === 0) s += `<text x="${L + i * bw + bw / 2}" y="${H - 7}" text-anchor="middle" fill="var(--ink-3)">${esc(hourLabel(h.hour))}</text>`; });
    return s + '</g></svg>';
  }

  function usagePanel() {
    const u = docs.usage;
    const body = !u ? '<p class="faint">Usage has not been exported yet.</p>'
      : `${usageChart(u, 440, 150, true)}<div class="legend" style="margin-top:10px"><span><i style="background:var(--live)"></i>Agents</span><span><i style="background:var(--ink-3)"></i>Main session</span><span><i style="background:var(--nogo)"></i>Limit hit</span></div><p class="faint" style="margin-top:10px">${fmtTok(u.totals?.effective)} effective · ${esc((u.totals?.requests || 0).toLocaleString())} requests · usage limit hit ${limitsOf(u).length}×</p>`;
    return `<div class="panel"><div class="ph"><h3>Claude usage</h3><button class="linkbtn" data-go="usage">View</button></div><div class="pb">${body}</div></div>`;
  }

  // Cost is each agent run's effective usage, never its reported tokens. A run naming several work items is split
  // equally among them. A PBI id is only unique within its project, so the per-work-item table is drawn only in a
  // project view, where the usage shown is that project's alone. Maps, not objects: the keys come from the store.
  function costPanels(subs) {
    const eff = x => Number(x.effective) || 0, byPbi = new Map(), byType = new Map();
    const add = (m, k, v) => { const c = m.get(k) || { n: 0, v: 0 }; c.n++; c.v += v; m.set(k, c); };
    let loose = 0, looseRuns = 0;
    subs.forEach(x => {
      const ids = [...new Set((Array.isArray(x.pbis) ? x.pbis : []).filter(id => typeof id === 'string' && id))];
      if (!ids.length) { loose += eff(x); looseRuns++; }
      ids.forEach(id => add(byPbi, id, eff(x) / ids.length));
      add(byType, String(x.type ?? 'unknown'), eff(x));
    });
    const table = (what, head, m, empty) => {
      const rows = [...m].sort((a, b) => b[1].v - a[1].v), max = Math.max(1, ...rows.map(r => r[1].v));
      return `<div class="pb flush scroll"><table data-cost="${what}"><thead><tr><th>${head}</th><th class="num">Runs</th><th style="min-width:150px">Effective</th></tr></thead><tbody>
        ${rows.map(([k, c]) => `<tr data-entry="${esc(k)}"><td>${esc(k)}</td><td class="num">${esc(c.n)}</td><td><div class="bar"><i style="width:${Math.max(2, c.v / max * 100)}%;background:var(--live)"></i></div><div class="sub">${fmtTok(c.v)}</div></td></tr>`).join('') || `<tr><td colspan="3" class="muted">${empty}</td></tr>`}
      </tbody></table></div>`;
    };
    const typePanel = `<div class="panel"><div class="ph"><h3>Cost per agent type</h3><span class="faint">effective usage</span></div>${table('type', 'Agent type', byType, 'No agent runs.')}</div>`;
    if (!inProject()) return `<div class="grid">${typePanel}</div>`;
    return `<div class="grid g-1-1">
      <div class="panel"><div class="ph"><h3>Cost per work item</h3><span class="faint">effective usage by the PBI ids in run labels</span></div>${table('pbi', 'Work item', byPbi, 'No agent run names a work item.')}
        <div class="pb faint" style="border-top:1px solid var(--rule)">A run naming several work items has its usage split equally among them.${looseRuns ? ` ${looseRuns} run${looseRuns === 1 ? ' names' : 's name'} no work item: ${fmtTok(loose)} effective.` : ''}</div></div>
      ${typePanel}
    </div>`;
  }

  function renderUsage() {
    const u = docs.usage, p = $('panel-usage');
    if (!u) { p.innerHTML = '<div class="empty">Usage has not been exported yet.</div>'; return; }
    const t = u.totals || {}, subs = u.subagents || [], lim = limitsOf(u), fc = forecastOf(u);
    const groups = (u.groups || []).slice().sort((a, b) => b.effective - a.effective), gmax = Math.max(1, ...groups.map(g => g.effective));
    const pct = v => t.effective ? Math.round(v / t.effective * 100) : 0;
    const subEff = subs.reduce((a, x) => a + x.effective, 0), smax = Math.max(1, ...subs.map(x => x.effective));
    const byType = {}; subs.forEach(x => { byType[x.type] = (byType[x.type] || 0) + x.effective; });
    const top = Object.entries(byType).sort((a, b) => b[1] - a[1])[0];
    const reread = groups.find(g => g.key === 'reread'), refused = lim.reduce((a, l) => a + (Number(l.refused) || 0), 0);
    const bullets = [
      subs.length ? `Agents accounted for ${pct(subEff)}% of usage across ${subs.length} run${subs.length === 1 ? '' : 's'}${top ? `; ${esc(top[0])} alone was ${pct(top[1])}%` : ''}.` : 'No agents were dispatched, so all of it is the main session.',
      reread ? `Keeping the conversation in memory took ${pct(reread.effective)}%. Each turn re-reads the instructions and everything so far, which is cheap per token but never stops.` : null,
      lim.length ? `A usage limit was hit ${lim.length} time${lim.length === 1 ? '' : 's'} and ${refused} request${refused === 1 ? ' was' : 's were'} refused. Work picked up again after each reset (${lim.map(l => esc(when(l.resetsAt))).join(' and ')}).` : 'No usage limit was hit.',
      (u.byModel || []).length > 1 ? `Two models shared the work: ${u.byModel.map(m => `${esc(m.label)} ${pct(m.effective)}%`).join(', ')}.` : null,
    ].filter(Boolean);
    p.innerHTML = `
      <h2>Claude usage</h2>${src(u)}
      <div class="tiles">
        ${tile('Effective usage', fmtTok(t.effective), 'input-token equivalents', 'var(--live)')}
        ${tile('Requests to Claude', esc((t.requests || 0).toLocaleString()), `${subs.length} agent runs`, 'var(--rule-2)')}
        ${tile('Done by agents', pct(subEff) + '%', 'of effective usage', 'var(--live)')}
        ${tile('Limit hits', lim.length, `${refused} requests refused`, 'var(--nogo)')}
        ${forecastTile(u)}
        ${tile('Output written', fmtTok(t.output), `${fmtTok(t.cacheRead)} tokens read from cache`, 'var(--rule-2)')}
      </div>
      <div class="callout warn">${icon('warn')}<p>Measured from the transcripts of ${esc(scopeName())} on your computer, ${esc(when(u.span?.first))} to ${esc(when(u.span?.last))}. It is not your plan's usage meter: Claude records the moments a limit was hit, not a percentage used. <b>Effective usage</b> weights each kind of token by relative cost (cache reads ×0.1, cache writes ×2, output ×5) so usage compares fairly with itself; it is not a price.</p></div>
      <div class="panel" style="margin-bottom:16px"><div class="ph"><h3>In plain terms</h3></div><div class="pb"><ul class="list">${bullets.map(b => `<li>${b}</li>`).join('')}</ul></div></div>
      <div class="grid g-1-1">
        <div class="panel"><div class="ph"><h3>Where it went</h3><span class="faint">effective usage by activity</span></div>
          <div class="pb"><div class="hbars">${groups.map(g => `<div class="r" style="grid-template-columns:minmax(120px,190px) minmax(0,1fr) 92px"><span>${esc(g.label)}</span><span class="bar"><i style="width:${g.effective / gmax * 100}%;background:${g.key === 'subagents' ? 'var(--live)' : 'var(--ink-3)'}"></i></span><span class="v">${fmtTok(g.effective)} · ${pct(g.effective)}%</span></div>`).join('')}</div>
          <p class="faint" style="margin-top:14px">The main session's own work is split by the tools each response used; re-reading the conversation is counted separately.</p></div></div>
        <div class="panel"><div class="ph"><h3>Over time</h3><div class="legend"><span><i style="background:var(--live)"></i>Agents</span><span><i style="background:var(--ink-3)"></i>Main session</span><span><i style="background:var(--nogo)"></i>Limit hit</span></div></div>
          <div class="pb scroll">${usageChart(u, 660, 250, false)}</div></div>
      </div>
      <div class="grid g-1-1">
        <div class="panel"><div class="ph"><h3>By model</h3></div><div class="pb flush scroll"><table><thead><tr><th>Model</th><th class="num">Requests</th><th class="num">Input</th><th class="num">Output</th><th class="num">Cache read</th><th class="num">Cache write</th><th class="num">Effective</th></tr></thead><tbody>
          ${(u.byModel || []).map(m => `<tr><td>${esc(m.label)}<div class="sub">${esc(m.model)}</div></td><td class="num">${esc(m.requests?.toLocaleString())}</td><td class="num">${fmtTok(m.input)}</td><td class="num">${fmtTok(m.output)}</td><td class="num">${fmtTok(m.cacheRead)}</td><td class="num">${fmtTok(m.cacheWrite)}</td><td class="num"><b>${fmtTok(m.effective)}</b></td></tr>`).join('')}
        </tbody></table></div></div>
        <div class="panel"><div class="ph"><h3>Usage limits</h3></div><div class="pb flush scroll"><table><thead><tr><th>Limit</th><th>First refused</th><th class="num">Refused</th><th>Reset</th></tr></thead><tbody>
          ${lim.map((l, k) => `<tr><td>${k + 1} · usage limit</td><td>${esc(when(l.firstAt))}</td><td class="num">${esc(l.refused)}</td><td>${esc(when(l.resetsAt)) || '—'}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No limit was hit.</td></tr>'}
        </tbody></table><div class="pb faint" data-forecast style="border-top:1px solid var(--rule)">${forecastNote(fc)}</div>${u.overage ? `<div class="pb faint" style="border-top:1px solid var(--rule)">${esc(u.overage)}</div>` : ''}</div></div>
      </div>
      ${costPanels(subs)}
      <div class="panel"><div class="ph"><h3>Agent runs</h3><span class="faint">${subs.length} runs · ${fmtTok(subEff)} effective</span></div><div class="pb flush scroll"><table><thead><tr><th>Agent</th><th>Task</th><th>Model</th><th class="num">Requests</th><th style="min-width:150px">Effective</th></tr></thead><tbody>
        ${subs.slice().sort((a, b) => b.effective - a.effective).map(x => `<tr><td style="white-space:nowrap">${esc(x.type)}</td><td>${esc(x.description)}</td><td class="muted">${esc(x.modelLabel)}</td><td class="num">${esc(x.requests)}</td><td><div class="bar"><i style="width:${Math.max(2, x.effective / smax * 100)}%;background:var(--live)"></i></div><div class="sub">${fmtTok(x.effective)}</div></td></tr>`).join('')}
      </tbody></table></div></div>`;
  }

  // Each tab is drawn on its own, so a tab that cannot read the data it was given leaves the others drawn.
  const RENDERERS = [[renderHeader, null], [renderOverview, 'overview'], [renderDispatch, 'dispatch'], [renderCatalogue, 'catalogue'], [renderSpec, 'spec'],
    [renderAssumptions, 'assumptions'], [renderDecisions, 'decisions'], [renderBacklog, 'backlog'], [renderGit, 'git'], [renderFindings, 'findings'], [renderUsage, 'usage']];
  // The store may not change for hours while the board sits idle, yet the clock alone changes two things drawn: whether
  // the forecast shown has gone by, and whether the session shown is past its running window (the header and the
  // "Running now" tiles). The minute timer compares this against what was last drawn and redraws once when it differs.
  // A forecast that cannot be computed counts as not passed, so it can never stop a redraw or the timer.
  const forecastIsPast = now => { try { const f = forecastOf(docs.usage); return f.state === 'ok' && f.at < now; } catch (e) { return false; } };
  const clockState = now => `${forecastIsPast(now)} ${isLive(now)} ${scopeLive(now)} ${waitingState(now)}`;
  // A render reads the clock once (renderNow) for the forecast tiles, the running window and the drawn state alike. A
  // second reading could fall past the forecast or the window's end, recording a state as drawn that no tile shows,
  // and the minute timer would then never redraw that tile.
  let renderNow = Date.now(), drawnClock = '';
  // One arrival of data can reach several of the page's readers at once. Held, they each leave a mark and the
  // board is drawn once at the end, from the state all of them left, instead of once per reader. Counted, not a
  // flag, so a nested hold cannot release the outer one; synchronous, so what is drawn is never a step behind.
  let held = 0, heldDraw = false;
  const holdRender = fn => {
    held++;
    // In the finally, so a reader that throws still leaves the board showing what did arrive, as it would have
    // if each reader had drawn for itself.
    try { fn(); } finally { held--; if (!held && heldDraw) { heldDraw = false; renderAll(); } }
  };
  function renderAll() {
    if (held) { heldDraw = true; return; }
    const now = renderNow = Date.now();
    RENDERERS.forEach(([draw, tab]) => {
      try { draw(); } catch (e) {
        console.error(`Board: the ${tab || 'header'} could not be drawn`, e);
        if (tab) $('panel-' + tab).innerHTML = '<div class="empty">This tab could not be shown from the current data.</div>';
      }
    });
    drawnClock = clockState(now);
  }

  // ---------------- project picker and session filter ----------------
  const PROJECT_TABS = ['spec', 'assumptions', 'decisions', 'backlog', 'git', 'findings'];
  const viewOf = p => 'p:' + p.id;
  const projectLive = p => p.running > 0 || sessions.some(s => s.project === p.id && sessionLive(s));
  const views = () => [...projects.map(viewOf), ...(unlinked().length ? [OTHER_VIEW] : [])];
  // autoView: the page chose the view itself, rather than taking the viewer's saved or picked one.
  let autoView = false, hadProjects = false;
  function pickView() {
    let saved = null;
    try { saved = localStorage.getItem('board-view'); } catch (e) {}
    const live = projects.find(projectLive);
    autoView = !views().includes(saved);
    return !autoView ? saved : live ? viewOf(live) : (views()[0] || null);
  }
  // A project defaults to all its sessions; "Other sessions" always shows one.
  function pickSession() {
    let saved = null;
    try { saved = localStorage.getItem('board-filter'); } catch (e) {}
    const list = filterSessions();
    if (inProject()) return list.some(s => s.id === saved) ? saved : '';
    return (list.find(s => s.id === saved) || list.find(sessionLive) || list[0] || {}).id || '';
  }
  // Before both lists load, nothing is chosen: choosing then would pass over the saved view.
  function sync() {
    loaded = gotSessions && gotProjects;
    if (!loaded) return;
    // A page opened before the first project push could only choose "Other sessions"; when projects
    // arrive, it chooses again, unless that view was the viewer's own choice.
    const firstProjects = !hadProjects && projects.length > 0;
    hadProjects = projects.length > 0;
    if (!views().includes(view) || (firstProjects && autoView)) { view = pickView(); sel = pickSession(); }
    else if ((sel || !inProject()) && !filterSessions().some(s => s.id === sel)) sel = pickSession();
  }
  // A picker that has focus is not rebuilt (that would close it while open); its blur catches it up.
  function fillPickers() {
    if (!loaded) return;
    const P = $('project'), S = $('session');
    if (document.activeElement !== P) {
      P.innerHTML = projects.map(p => `<option value="${esc(viewOf(p))}"${viewOf(p) === view ? ' selected' : ''}>${esc(p.name + (projectLive(p) ? ' · live' : ''))}</option>`).join('')
        + (unlinked().length ? `<option value="${OTHER_VIEW}"${view === OTHER_VIEW ? ' selected' : ''}>Other sessions · last ${esc(windowDays())} days</option>` : '')
        || '<option>No recent sessions</option>';
      P.disabled = !views().length;
    }
    if (document.activeElement !== S) {
      const list = filterSessions(), dup = {};
      list.forEach(s => { dup[s.title] = (dup[s.title] || 0) + 1; });
      const opt = s => `<option value="${esc(s.id)}"${s.id === sel ? ' selected' : ''}>${esc(s.title + (dup[s.title] > 1 && s.folder ? ' · ' + s.folder : '') + (sessionLive(s) ? ' · live' : ''))}</option>`;
      S.innerHTML = (inProject() ? `<option value=""${sel ? '' : ' selected'}>All sessions · ${esc(list.length)}</option>` : '') + list.map(opt).join('')
        || '<option>No sessions</option>';
      S.disabled = !list.length;
    }
  }
  function apply() {
    const p = proj();
    runs = p ? allRuns.filter(r => r.project === p.id && (!sel || r.session === sel)) : allRuns.filter(r => r.session === sel);
    status = p ? statuses[p.statusDoc] || null : null;
    PROJECT_TABS.forEach(t => { docs[t] = p ? tabDocs[p.id + '.' + t] || null : null; $('tab-' + t).hidden = !p; });
    docs.usage = (p && !sel ? p.usage : cur()?.usage) || null;
    // Before the lists load no project is chosen, so every project tab is hidden; falling back then would
    // overwrite the saved tab.
    if (loaded && tabs.find(t => t.getAttribute('aria-selected') === 'true')?.hidden) select('overview');
    renderAll();
  }
  $('project').addEventListener('change', e => {
    view = e.target.value;
    autoView = false;
    try { localStorage.setItem('board-view', view); } catch (x) {}
    sel = pickSession();
    fillPickers();
    apply();
  });
  $('session').addEventListener('change', e => {
    sel = e.target.value;
    try { localStorage.setItem('board-filter', sel); } catch (x) {}
    apply();
  });
  $('project').addEventListener('blur', fillPickers);
  $('session').addEventListener('blur', fillPickers);
  apply();
  setInterval(() => { const now = Date.now(); renderHeader(now); fillPickers(); if (clockState(now) !== drawnClock) renderAll(); }, 60000);

  // ---------------- the data adapters ----------------
  // Nothing above this line knows where a document came from. An adapter offers two calls, each of which reports
  // the current value at once and again whenever it changes:
  //   collection(name, order, cb) -> cb([{ id, ...doc }]), sorted by the document field `order`
  //   doc(path, cb)               -> cb(doc), or cb(null) when the document does not exist

  const storeAdapter = db => {
    const fail = e => { $('foot').textContent = 'A live subscription ended (' + e.code + '). Reload the page to reconnect.'; };
    const all = snap => snap.docs.filter(x => x.exists).map(x => ({ id: x.id, ...x.data() }));
    return {
      collection: (name, order, cb) => db.collection(name).orderBy(order).onSnapshot(snap => cb(all(snap)), fail),
      doc: (path, cb) => db.doc(path).onSnapshot(snap => cb(snap.exists ? snap.data() : null), fail),
    };
  };

  // The local server's API: one snapshot object keyed by store path, each entry { kind, id, doc }, then a stream
  // of whole documents (added or changed in `set`, gone in `deleted`) with a `reset` telling the page to re-fetch.
  // Only the paths the calls above name are ever read, so a record in any other collection is inert here.
  const localAdapter = async local => {
    let records = {};
    const watchers = [];
    const watch = w => { watchers.push(w); w(); };
    // One event carries whole documents for any number of paths, so every reader it touches is told before the
    // board is drawn: one event, one render pass, as one store snapshot is.
    const notify = () => holdRender(() => watchers.forEach(w => w()));
    const entry = path => { const e = records[path]; return e && e.doc && typeof e.doc === 'object' ? e : null; };
    // The store orders a collection by a document field; this reproduces that, with the id breaking a tie so the
    // same data is always in the same order.
    const cmp = (a, b) => typeof a === 'number' && typeof b === 'number' ? a - b
      : a === undefined ? 1 : b === undefined ? -1 : String(a) < String(b) ? -1 : String(a) > String(b) ? 1 : 0;
    // An answer that is not a snapshot is a failed read, not an empty board: a 200 of the wrong shape would
    // otherwise draw the normal empty states, which the owner cannot tell from a database with nothing in it yet.
    // An empty records map is kept, because a collector that has not written yet is a real and honest state.
    const read = async () => {
      const r = await fetch(local.snapshot, { headers: { accept: 'application/json' } });
      if (!r?.ok) throw new Error('the local server answered ' + r?.status);
      const body = await r.json();
      if (!body?.records || typeof body.records !== 'object' || Array.isArray(body.records)) throw new Error('the local server answered with something that is not a snapshot');
      records = body.records;
      return Number.isFinite(body.version) ? body.version : 0;
    };
    // The first read decides whether there is a board at all, so its failure is the caller's to report.
    const version = await read();
    const stopped = () => { $('foot').textContent = 'Live updates from the local server stopped. Reload the page to reconnect.'; };
    if (typeof EventSource === 'function') {
      // Joined once, at the version the snapshot was taken at, and never rebuilt: the page keeps no resume
      // position of its own to drift. A dropped stream is resumed by the browser, which replays the id of the
      // last event it saw as Last-Event-ID, and the server resumes from whichever of that and this query
      // position is further on, so an old query string here can never rewind the stream.
      const es = new EventSource(local.events + '?since=' + version);
      es.addEventListener('change', ev => {
        let d = null;
        try { d = JSON.parse(ev.data); } catch (e) { console.warn('Board: an unreadable event from the local server', e); return; }
        if (d?.set && typeof d.set === 'object') Object.assign(records, d.set);
        if (Array.isArray(d?.deleted)) d.deleted.forEach(p => { delete records[p]; });
        notify();
      });
      es.addEventListener('reset', () => read().then(notify, e => { console.warn('Board: the local server could not be re-read', e); stopped(); }));
      // EventSource reconnects on its own, so an error is only worth reporting once it has stopped trying.
      es.addEventListener('error', () => { if (es.readyState === 2) stopped(); });
    }
    return {
      collection: (name, order, cb) => watch(() => cb(Object.keys(records)
        .filter(p => p.startsWith(name + '/') && entry(p))
        .map(p => ({ id: records[p].id, ...records[p].doc }))
        .sort((x, y) => cmp(x[order], y[order]) || cmp(x.id, y.id)))),
      doc: (path, cb) => watch(() => cb(entry(path)?.doc || null)),
    };
  };

  // A URL the page is willing to reach for: one on the page's own origin. A path relative to the page resolves
  // to that origin, which is the form the local server injects. A javascript: or data: URL has no origin of its
  // own, so it can never match and is refused here rather than left to what fetch and EventSource happen to do
  // with it. Only whoever serves the page can set the marker, so this is depth, not the only defence.
  const sameOrigin = url => {
    if (typeof url !== 'string') return false;
    try { const here = new URL(location.href); return new URL(url, here).origin === here.origin; } catch (e) { return false; }
  };

  (async () => {
    // Where the page was loaded decides its source. The local server injects __DISPATCH_LOCAL__, naming both its
    // URLs, into the page it wraps; the artifact never carries it, and could not reach the local API in any case.
    // Both URLs are checked, because both are used: a marker naming only one of them is not a page it served.
    const local = window.__DISPATCH_LOCAL__;
    let adapter = null;
    if (local && sameOrigin(local.snapshot) && sameOrigin(local.events)) {
      source = 'the local server';
      // A server that cannot be reached is said out loud: a board that quietly drew nothing would read as a board
      // with nothing on it.
      try { adapter = await localAdapter(local); } catch (e) { console.warn('Board: the local server could not be reached', e); }
    } else {
      // A store that refuses to open is shown as out of reach, like an absent one, rather than left reading Connecting.
      let db = null;
      try { db = await window.claude?.use?.('db'); } catch (e) { console.warn('Board: the live store could not be opened', e); }
      if (db) adapter = storeAdapter(db);
    }
    if (!adapter) { offline = true; renderAll(); $('foot').textContent = `This view cannot reach ${source}, so it shows no data.`; return; }
    const refresh = () => { sync(); fillPickers(); apply(); };
    const watched = new Set();
    const watchStatus = path => {
      if (!path || watched.has(path)) return;
      watched.add(path);
      adapter.doc(path, doc => { statuses[path] = doc; apply(); });
    };
    adapter.collection('sessions', 'last', docs => { sessions = docs.reverse(); gotSessions = true; refresh(); });
    adapter.collection('projects', 'order', docs => {
      projects = docs;
      gotProjects = true;
      projects.forEach(p => watchStatus(p.statusDoc));
      refresh();
    });
    adapter.collection('runs', 'seq', docs => { allRuns = docs; gotRuns = true; apply(); });
    adapter.collection('projectTabs', 'generatedAt', docs => { tabDocs = Object.fromEntries(docs.map(d => [d.id, d])); apply(); });
    adapter.doc('catalogue/index', doc => { catalogue = doc; gotCatalogue = true; apply(); });
    adapter.doc('meta/lastRefresh', doc => { lastRefresh = doc; apply(); });
  })();
})();
</script>
